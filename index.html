<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mentor Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Giao diện theo thương hiệu landing huytim.com: nền ấm, mực đen, Fraunces cho tiêu đề, Inter cho nội dung.
   Viền mảnh 1px, bo góc 8-12px, màu trạng thái dịu. Chỉ có chế độ sáng (landing không có chế độ tối). */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --ink:#141413; --muted:#5b5a56; --soft:#8a8984; --line:#e4e2dc; --line2:#cfcdc6;
  --accent:#141413; --accent-ink:#ffffff; --todo:#efeee9;
  --ok:#2e7d4f; --ok-bg:#edf6f0; --warn:#8f6a00; --warn-bg:#fbf5e1; --bad:#b3372c; --bad-bg:#fbeceb;
  --f-ok:#3b7bf0; --f-warn:#f0a500; --f-bad:#e0372b; --done:#1fa25a; --done-bg:#e6f5ec; --info:#2456c9; --info-bg:#e8effd;
  --field:#ffffff; --focus:#2563eb;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Fraunces,Georgia,serif;
  --r:12px; --rs:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.55;border-top:2px solid #111;
  padding-inline:16px;padding-block:0 56px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
header.bar{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between;padding-block:22px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
header.bar>div:first-child{padding-bottom:12px}
header.bar h1{font-family:var(--serif);font-size:22px;font-weight:700;margin:0;letter-spacing:-.005em;line-height:1.15}
header.bar .sub{color:var(--soft);font-size:12px;margin-top:3px}
nav.tabs{display:flex;gap:2px;background:none;padding:0}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Dải số liệu: một khối, chia bằng đường kẻ mảnh */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin:0 0 26px;padding:0}
.stat{background:var(--surface);padding:14px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stat .v{font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--ok)}

.markets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:28px;align-items:start}
.mk h2{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between;gap:12px}
.mk h2 span{font-weight:400;letter-spacing:0;text-transform:none;color:var(--soft)}
.list{display:flex;flex-direction:column;gap:14px}
.empty{color:var(--soft);padding:22px;border:1px dashed var(--line2);border-radius:var(--r);background:rgba(255,255,255,.5)}

.stu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:0 1px 2px rgba(20,20,19,.04)}
.stu .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.stu .nm{font-weight:600;font-size:15.5px}
.stu .pk{color:var(--soft);font-size:12px;margin-left:8px;font-weight:400}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 10px 2px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.r1{background:var(--ok-bg);color:var(--ok)} .pill.r2{background:var(--warn-bg);color:var(--warn)}
.pill.r3{background:var(--bad-bg);color:var(--bad)} .pill.r0{background:var(--todo);color:var(--muted)}
.track{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:14px 0 10px}
.seg{height:22px;border-radius:4px;background:var(--todo);color:var(--soft);font-size:11px;font-weight:500;display:grid;place-items:center}
.seg.done{background:var(--accent);color:var(--accent-ink)}
.seg.cur{background:var(--surface);box-shadow:inset 0 0 0 2px currentColor;font-weight:600}
.seg.cur.r1{color:var(--f-ok)} .seg.cur.r2{color:var(--f-warn)} .seg.cur.r3{color:var(--f-bad)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px}
.meta .step{font-weight:600}
.meta .days{color:var(--muted)}
.why{margin-top:8px;font-size:13px;padding-left:10px;border-left:2px solid var(--line2)}
.why.r3{color:var(--bad);border-left-color:var(--f-bad)}.why.r2{color:var(--warn);border-left-color:var(--f-warn)}
.meet{margin-top:8px;font-size:13px;color:var(--muted)}.meet.none{color:var(--bad);font-weight:500}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--ink);font-weight:600;font-size:13px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +";color:var(--soft)}
details[open] summary::after{content:" \2212"}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px 22px;margin-top:12px}
.cols h4{margin:0 0 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:600}
.cols p{margin:0;white-space:pre-line;font-size:13.5px}
.cols .full{grid-column:1/-1}

/* Màn hình nhập liệu */
.edit{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.edit{grid-template-columns:1fr}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.side h3{margin:14px 8px 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:600}
.side h3:first-child{margin-top:2px}
.pick{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:var(--rs);cursor:pointer;margin-bottom:2px}
.pick:hover{background:#f6f5f1} .pick[aria-current="true"]{background:#f1f0eb;color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--ink)}
.pick small{color:var(--soft)}
.add{width:100%;margin:6px 0 2px;border:1px solid var(--line2);background:var(--surface);border-radius:var(--rs);padding:7px;cursor:pointer;color:var(--ink);font-weight:500}
.add:hover{background:#f3f2ee;border-color:#b6b4ac}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.panel+.panel{margin-top:16px}
.panel h3{margin:0 0 14px;font-family:var(--serif);font-size:17px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px 16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
.f input,.f select,.f textarea,.row input,.row select,.row textarea{background:var(--field);border:1px solid var(--line2);border-radius:var(--rs);padding:8px 11px;color:var(--ink);width:100%;min-width:0;font-weight:400}
.f input,.f select,.row input,.row select{min-height:38px}
.f input:hover,.f select:hover,.f textarea:hover,.row input:hover,.row select:hover,.row textarea:hover{border-color:#b6b4ac}
.f input:focus,.f select:focus,.f textarea:focus,.row input:focus,.row select:focus,.row textarea:focus{border-color:var(--ink)}
.f textarea,.row textarea{resize:vertical;min-height:64px;line-height:1.5}
.f.wide{grid-column:1/-1}
.steps{display:flex;flex-direction:column}
.step-row{display:grid;grid-template-columns:28px minmax(0,1fr) 150px auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.step-row:first-child{border-top:0}
.step-row .n{font-weight:600;color:var(--soft)}
.step-row.done .n{color:var(--ink)}
.step-row .t small{display:block;color:var(--soft);font-size:12px}
@media (max-width:560px){.step-row{grid-template-columns:24px minmax(0,1fr);}.step-row input,.step-row .acts{grid-column:2}}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--rs);padding:7px 14px;cursor:pointer;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:#f3f2ee;border-color:#b6b4ac}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#2c2c2a;border-color:#2c2c2a}
.btn.danger{color:var(--bad);border-color:#e3b8b3} .btn.danger:hover{background:var(--bad-bg)} .btn.sm{padding:4px 10px;font-size:12px}
.acts{display:flex;gap:6px}
.mrow{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:10px}
.mrow .head{display:grid;grid-template-columns:150px 110px 150px minmax(0,1fr) auto;gap:8px;align-items:center}
@media (max-width:700px){.mrow .head{grid-template-columns:1fr 1fr}}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.note{color:var(--soft);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:9px 16px;border-radius:var(--rs);font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.show{opacity:1}
.banner{background:var(--surface);color:var(--muted);border:1px solid var(--line);border-left:3px solid var(--f-warn);padding:10px 14px;border-radius:var(--rs);margin-bottom:16px;font-size:13px}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:24px}

/* Màn hình đăng nhập */
.login-card{max-width:380px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 24px rgba(20,20,19,.06)}
.login-card h1{margin:0;font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.15}
.login-card p{margin:0;color:var(--muted)}
.login-card .btn.primary{height:42px;margin-top:4px}
.login-card #loginmsg{font-size:13px;color:var(--muted);min-height:1.3em}

/* Tổng quan bổ sung: rủi ro, việc cần xử lý, lịch tuần, phân bố bước, nhịp họp, bảng kiểm tra */
.sec{margin:0 0 34px}
.sec>h2{font-family:var(--serif);font-size:18px;font-weight:700;margin:0 0 4px}
.sec>.hint{color:var(--soft);font-size:12.5px;margin:0 0 12px}
.riskbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--todo);margin:-10px 0 6px}
.riskbar i{display:block}
.riskbar .r0{background:var(--line2)}.riskbar .r1{background:var(--f-ok)}.riskbar .r2{background:var(--f-warn)}.riskbar .r3{background:var(--f-bad)}
.rlegend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:var(--muted);margin:0 0 28px}
.rlegend b{font-weight:600;color:var(--ink)}
.rlegend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line2)}
.rlegend .r1::before{background:var(--f-ok)}.rlegend .r2::before{background:var(--f-warn)}.rlegend .r3::before{background:var(--f-bad)}
.at{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.at-i{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 18px;padding:12px 18px;border-top:1px solid var(--line);border-left:3px solid var(--line2)}
.at-i:first-child{border-top:0}
.at-i.s3{border-left-color:var(--f-bad)}.at-i.s2{border-left-color:var(--f-warn)}.at-i.s1{border-left-color:var(--line2)}
.at-i .who strong{display:block}.at-i .who span{color:var(--soft);font-size:12px}
.at-i ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.at-i li{font-size:13.5px;color:var(--muted)}.at-i li.s3{color:var(--bad);font-weight:500}.at-i li.s2{color:var(--warn);font-weight:500}
@media (max-width:640px){.at-i{grid-template-columns:1fr}}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wk+.wk{margin-top:14px}
.wkh{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:6px;min-width:760px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:8px 9px;min-height:84px}
.day.past{background:#fbfaf8}.day.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .dn{font-size:11.5px;font-weight:600;color:var(--soft);margin-bottom:6px}.day.today .dn{color:var(--ink)}
.day .none{font-size:12px;color:var(--line2)}
.mt{font-size:12.5px;font-weight:500;padding:4px 6px;border-radius:5px;margin-bottom:4px;line-height:1.3}
.mt small{display:block;font-weight:400;font-size:11px;opacity:.85}
.mt.up{background:var(--todo);color:var(--ink)}.mt.held{background:var(--ok-bg);color:var(--ok)}.mt.oth{background:var(--warn-bg);color:var(--warn)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:34px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.two>*,.sec,.scrollx{min-width:0}
.dist{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 22px;gap:2px 10px;align-items:center;margin-bottom:8px}
.dist .lb{font-size:13px;color:var(--muted)}
.dist .bar{height:14px;background:var(--todo);border-radius:4px;overflow:hidden}
.dist .bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.dist .ct{font-weight:600;text-align:right}
.dist .who{grid-column:2/4;font-size:12px;color:var(--soft);margin-top:-2px}
.rg{display:grid;gap:4px;align-items:center;min-width:420px}
.rg .h{font-size:11px;color:var(--soft);text-align:center}
.rg .nm{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg .c{height:24px;border-radius:4px;background:transparent;border:1px dashed var(--line)}
.rg .c.held{background:var(--ink);border-color:var(--ink)}.rg .c.sched{background:var(--surface);border:2px solid var(--ink)}
.rg .c.miss{background:var(--bad-bg);border:1px solid #e3b8b3}.rg .c.off{border-color:transparent}
.rlg2{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);margin-top:8px}
.rlg2 i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:13px;min-width:860px}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:600;text-align:left;padding:10px 12px;background:#faf9f6;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl .w{color:var(--bad);font-weight:500}.tbl .m{color:var(--soft)}.tbl .o{color:var(--ok);font-weight:500}
.contact{margin-top:6px;font-size:12.5px;color:var(--muted)}.contact.none{color:var(--warn)}
.goal{margin-top:6px;font-size:13px}.goal b{font-weight:600}

/* ===== Giao diện Theo dõi v2: sổ theo dõi, ít khung, chữ làm chủ đạo ===== */
.brief{display:flex;flex-wrap:wrap;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin:0 0 14px;background:none}
.fig{flex:1 1 130px;padding:16px 18px 14px 0;min-width:0}
.fig+.fig{padding-left:18px;border-left:1px solid var(--line)}
.fig b{display:block;font-family:var(--serif);font-weight:700;font-size:38px;line-height:1;letter-spacing:-.025em}
.fig span{display:block;font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.35}
.fig.bad b{color:var(--bad)}.fig.warn b{color:var(--warn)}.fig.ok b{color:var(--ok)}
@media (max-width:640px){.fig{flex:1 1 44%;border-left:0!important;padding-left:0!important}}
.riskbar{display:flex;height:6px;border-radius:0;overflow:hidden;background:var(--todo);margin:0 0 8px}
.rlegend{margin:0 0 34px}
.rlegend span::before{border-radius:1px;width:8px;height:8px}
.sec{border-top:1px solid var(--line);padding-top:22px;margin:0 0 38px}
.sec>h2{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
.sec>.hint{color:var(--soft);font-size:13px;margin:0 0 16px;max-width:62ch}

/* Việc cần xử lý: danh sách chữ, không khung */
.atl{display:flex;flex-direction:column}
.ai{display:grid;grid-template-columns:210px minmax(0,1fr);gap:6px 24px;padding:14px 0;border-top:1px solid var(--line)}
.ai:first-child{border-top:0;padding-top:4px}
.ai .who b{display:block;font-weight:600;font-size:15px}.ai .who span{color:var(--soft);font-size:12.5px}
.ai ul{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.ai li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;font-size:14px}
.ai li em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding-top:2px;color:var(--soft)}
.ai li.s3 em{color:var(--bad)}.ai li.s2 em{color:var(--warn)}
.ai li.s3{font-weight:500}
@media (max-width:640px){.ai{grid-template-columns:1fr;gap:4px}}

/* Danh sách học viên theo hàng */
.ros .gt{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);padding:18px 0 8px;border-bottom:1px solid var(--ink)}
.ros .gt span{font-weight:400;letter-spacing:0;text-transform:none;color:var(--soft)}
.ros .gt:first-of-type{padding-top:4px}
.ros .hd,.rw{display:grid;grid-template-columns:minmax(150px,1.15fr) minmax(210px,2fr) 124px minmax(150px,1.25fr) 120px;gap:6px 26px;align-items:start}
.ros .hd{padding:10px 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:600}
.rw{padding:16px 0 14px;border-top:1px solid var(--line)}
.gt+.rw{border-top:0}
.rw .nm{font-weight:600;font-size:15.5px;line-height:1.3}
.rw .sb{color:var(--muted);font-size:12.5px;margin-top:2px}
.rw .ct{color:var(--soft);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}.rw .ct.none{color:var(--warn)}
.ruler{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;height:10px;margin-top:5px}
.ruler i{display:block;background:var(--todo);border-radius:1px}
.ruler i.d{background:var(--ink)}
.ruler i.c.r0,.ruler i.c.r1{background:var(--f-ok)}.ruler i.c.r2{background:var(--f-warn)}.ruler i.c.r3{background:var(--f-bad)}
.stp{margin-top:8px;font-weight:500;font-size:13.5px}
.rw .why{margin-top:5px;font-size:12.5px;padding:0;border:0;color:var(--muted)}
.rw .why.r3{color:var(--bad)}.rw .why.r2{color:var(--warn)}
.dd{font-size:13.5px;color:var(--muted)}.dd b{color:var(--ink);font-size:20px;font-weight:600;letter-spacing:-.02em;margin-right:2px}

  for(n=1;n<=ns;n++){ if(steps[n]) done++; }
  for(n=1;n<=ns;n++){ if(!steps[n]){cur=n;break;} }
  var since=null, days=0, std=null, ratio=0;
  if(cur<=ns){ since=parse(cur===1?s.start:steps[cur-1])||parse(s.start); days=since?Math.max(0,diff(t,since)):0; std=pbm[cur-1].std[mk]; ratio=days/std; }
  var ms=meetings.filter(function(m){return m.studentId===s.id});
  var held=ms.filter(function(m){return m.status==="Đã họp"&&parse(m.date)}).sort(function(a,b){return a.date<b.date?1:-1});
  var lastHeld=held.length?held[0]:null;
  var startD=parse(s.start);
  var gap=lastHeld?diff(t,parse(lastHeld.date)):(startD?Math.max(0,diff(t,startD)):0);
  var risk=1, why=[];
  if(cur===11){risk=0}
  else{
    if(s.flag==="ket"){risk=3; why.push("Đang kẹt"+(s.blocker?": "+s.blocker:""))}
    if(ratio>1.5){risk=3; why.push("Đã "+days+" ngày ở bước này, chuẩn "+std+" ngày")}
    else if(ratio>1){risk=Math.max(risk,2); why.push("Hơi chậm: "+days+" ngày, chuẩn "+std+" ngày")}
    if(s.flag==="cho"||s.flag==="cham"){risk=Math.max(risk,2); why.push(FLAGS[s.flag]+(s.blocker?": "+s.blocker:""))}
    if(gap>10){risk=Math.min(3,risk+1); why.push(gap+" ngày chưa họp")}
  }
  // meeting status
  var ws=new Date(t); ws.setDate(ws.getDate()-((t.getDay()+6)%7)); var we=new Date(ws); we.setDate(we.getDate()+7);
  var inWeek=ms.filter(function(m){var d=parse(m.date);return d&&d>=ws&&d<we&&m.status!=="Hủy"});
  var heldWeek=inWeek.filter(function(m){return m.status==="Đã họp"});
  var upcoming=ms.filter(function(m){var d=parse(m.date);return d&&d>=t&&(m.status==="Sắp tới")}).sort(function(a,b){return a.date<b.date?-1:1});
  var meet, meetNone=false;

  else if(upcoming.length){meetNone=true; meet="Chưa có lịch họp trong 7 ngày tới (kế tiếp "+fmt(upcoming[0].date)+")"}

  var active=(s.status||"Đang mentor")==="Đang mentor";
  var nextM=upcoming.length?upcoming[0]:null, nextIn=nextM?diff(parse(nextM.date),t):null;
  var missing=[];
  if(!s.phone&&!s.email) missing.push("liên hệ");
  if(!s.pkg) missing.push("gói");
  if(!s.platform) missing.push("sàn");
  if(!s.niche) missing.push("ngách");
  if(!s.goal) missing.push("mục tiêu");
  var attn=[];
  if(active&&cur<=ns){
    if(s.flag==="ket") attn.push({sev:3,t:"Đang kẹt"+(s.blocker?": "+s.blocker:"")});

    if(ratio>1.5) attn.push({sev:3,t:"Đã "+days+" ngày ở bước "+cur+", chuẩn "+std+" ngày"});
    else if(ratio>1) attn.push({sev:2,t:"Hơi chậm ở bước "+cur+": "+days+" ngày, chuẩn "+std+" ngày"});
    if(!nextM||nextIn>=7) attn.push({sev:2,t:"Chưa có lịch họp trong 7 ngày tới"});

}

function secTimeline(live){
  var t=today(), rows=live.slice().sort(function(a,b){return (a.s.createdAt||0)-(b.s.createdAt||0)});
  var starts=rows.map(function(a){return a.startD}).filter(Boolean); if(!starts.length) return '';
  var d0=new Date(Math.min.apply(null,starts)), d1=addDays(t,14);
  var span=Math.max(21,diff(d1,d0)), W=1000, LM=160, RM=16, TM=30, RH=46, H=TM+rows.length*RH+10;
  var X=function(d){return LM+(diff(d,d0)/span)*(W-LM-RM)};
  var col=function(r){return r>=3?"var(--f-bad)":(r===2?"var(--f-warn)":"var(--f-ok)")};
  var g='';
  var wk=mondayOf(d0); if(wk<d0) wk=addDays(wk,7);
  for(;wk<=d1;wk=addDays(wk,7)){ var x=X(wk); g+='<line x1="'+x+'" x2="'+x+'" y1="'+(TM-6)+'" y2="'+(H-6)+'" style="stroke:var(--line)" /><text class="wk" x="'+(x+3)+'" y="'+(TM-12)+'">'+pad(wk.getDate())+'/'+pad(wk.getMonth()+1)+'</text>'; }
  rows.forEach(function(a,i){
    var cy=TM+i*RH+22, nm=a.s.name.length>22?a.s.name.slice(0,21)+"…":a.s.name;
    g+='<text class="nm" x="0" y="'+(cy+4)+'">'+esc(nm)+'</text><line x1="'+LM+'" x2="'+(W-RM)+'" y1="'+cy+'" y2="'+cy+'" style="stroke:var(--line)" />';
    var prev=a.startD||t;
    for(var k=1;k<=a.ns;k++){
      var dd=parse((a.s.steps||{})[k]); if(!dd) break;
      var x0=X(prev), x1=X(dd); g+='<rect x="'+x0+'" y="'+(cy-5)+'" width="'+Math.max(3,x1-x0-1.5)+'" height="10" style="fill:var(--done)"><title>'+k+'. '+esc(a.pb[k-1].name)+' (xong '+fmt((a.s.steps||{})[k])+')</title></rect>';
      prev=dd;
    }
    if(a.cur<=a.ns){
      var xs=X(prev), xe=X(t); g+='<rect x="'+xs+'" y="'+(cy-5)+'" width="'+Math.max(3,xe-xs)+'" height="10" style="fill:'+col(a.risk)+'"><title>Bước '+a.cur+': '+esc(a.pb[a.cur-1].name)+', ngày '+a.days+' / chuẩn '+a.std+'</title></rect>';
      var xx=X(addDays(prev,a.std)); g+='<line x1="'+xx+'" x2="'+xx+'" y1="'+(cy-11)+'" y2="'+(cy+11)+'" style="stroke:var(--ink);stroke-width:1.5" />';
    }
    a.ms.forEach(function(m){
      var md=parse(m.date); if(!md||m.status==="Hủy"||md<d0||md>d1) return;
      var held=m.status==="Đã họp";
      g+='<circle cx="'+X(md)+'" cy="'+(cy-16)+'" r="4.5" style="fill:'+(held?'var(--ink)':'var(--surface)')+';stroke:var(--ink);stroke-width:1.5"><title>'+fmt(m.date)+' · '+esc(m.status)+'</title></circle>';
    });
  });
  var xt=X(t); g+='<line x1="'+xt+'" x2="'+xt+'" y1="'+(TM-6)+'" y2="'+(H-6)+'" style="stroke:var(--ink);stroke-dasharray:3 3" /><text class="today" x="'+(xt+4)+'" y="'+(H)+'">hôm nay</text>';
  return '<section class="sec"><h2>Dòng thời gian từng học viên</h2><p class="hint">Mỗi hàng là hành trình của một học viên từ ngày bắt đầu đến hôm nay. Vạch đen đứng là mốc chuẩn của bước đang làm.</p>'
    +'<div class="scrollx"><svg class="tl" viewBox="0 0 '+W+' '+(H+8)+'" role="img" aria-label="Dòng thời gian từng học viên">'+g+'</svg></div>'
    +'<div class="legend"><span><i style="background:var(--done)"></i>Bước đã xong</span><span><i style="background:var(--f-ok)"></i>Bước đang làm, đúng hạn</span><span><i style="background:var(--f-warn)"></i>Chậm</span><span><i style="background:var(--f-bad)"></i>Cần can thiệp</span><span><i class="dot" style="background:var(--ink)"></i>Buổi đã họp</span><span><i class="dot" style="box-shadow:inset 0 0 0 1.5px var(--ink)"></i>Buổi có lịch</span></div></section>';
}

function mdLite(src){
  var L=String(src||"").split("\n"),o="",i=0;
  while(i<L.length){
    var l=L[i];
    if(/^\s*$/.test(l)){i++;continue}
    if(/^#{2,3}\s/.test(l)){o+='<h4>'+inl(l.replace(/^#{2,3}\s+/,""))+'</h4>';i++;continue}
    if(/^-\s/.test(l)){var li="";while(i<L.length&&/^-\s/.test(L[i])){li+='<li>'+inl(L[i].replace(/^-\s+/,""))+'</li>';i++}o+='<ul>'+li+'</ul>';continue}
    if(/^\|/.test(l)){
      var rows=[];
      while(i<L.length&&/^\|/.test(L[i])){
        if(!/^\|[\s:|-]+\|?\s*$/.test(L[i])) rows.push(L[i].replace(/^\||\|\s*$/g,"").split("|").map(function(c){return c.trim()}));
        i++;
      }
      o+='<div class="scrollx"><table class="rt">'+rows.map(function(r,k){return '<tr>'+r.map(function(c){return k?'<td>'+inl(c)+'</td>':'<th>'+inl(c)+'</th>'}).join("")+'</tr>'}).join("")+'</table></div>';
      continue;
    }
    var p=[];
    while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#{2,3}\s|-\s|\|)/.test(L[i])){p.push(L[i]);i++}
    o+='<p>'+inl(p.join(" "))+'</p>';
  }
  return o;
}

function stepModel(a){
  var s=a.s, steps=s.steps||{}, mk=a.mk, prev=parse(s.start), out=[];
  for(var n=1;n<=a.ns;n++){
    var d=parse(steps[n]), pb=a.pb[n-1], std=pb.std[mk], sub=subs(n,mk), ck=((s.checks||{})[n])||[];
    var st=d?"done":(n===a.cur?"cur":"todo"), days=null;
    if(d&&prev) days=Math.max(0,diff(d,prev)); else if(st==="cur") days=a.days;
    var nd=st==="done"?sub.length:ck.filter(function(i){return i>=0&&i<sub.length}).length;
    out.push({n:n,pb:pb,st:st,raw:steps[n],days:days,std:std,sub:sub,ck:ck,nd:nd});
    if(d) prev=d;
  }
  return out;
}

      if(w.ms.length) out+='<div class="blk"><h4>Buổi họp và take note của mentor</h4>'+w.ms.slice().sort(function(p,q){return p.date<q.date?-1:1}).map(function(m){
        return '<div class="mt '+(m.status==="Đã họp"?'ok':'')+'"><b>'+fmt(m.date)+(m.time?' '+esc(m.time):'')+'</b><span>'+esc(m.status)+'</span>'+(m.notes?'<p>'+esc(m.notes)+'</p>':'')+(m.actions?'<p><strong>Việc tiếp theo:</strong> '+esc(m.actions)+'</p>':'')+'</div>'}).join("")+'</div>';
      if(w.rs.length) out+='<div class="blk"><h4>Báo cáo phân tích</h4>'+w.rs.map(function(r){return '<p>'+fmt(r.date)+' · '+esc(r.title)+' (xem tab Báo cáo)</p>'}).join("")+'</div>';
      out+='</div>';
    });
    return out+'</section>';
  }
  if(tab==="lich-hop"){
    out+='<section class="sec"><h2>Lịch họp</h2>';
    if(!ms.length) out+='<div class="empty">Chưa có buổi họp nào.</div>';
    else out+=ms.map(function(m){
      var link=/^https:\/\//.test(m.link||"")?'<p><a href="'+esc(m.link)+'" target="_blank" rel="noopener">Link họp</a></p>':'';
      return '<div class="mm"><div class="d"><b>'+fmt(m.date)+(m.time?' '+esc(m.time):'')+'</b><span>'+esc(m.status)+'</span></div><div>'
        +(m.notes?'<p>'+esc(m.notes)+'</p>':'')+(m.actions?'<p><strong>Action items:</strong> '+esc(m.actions)+'</p>':'')+link+'</div></div>';
    }).join("");
    return out+'</section>';
  }
  if(tab==="bao-cao"){
    out+='<section class="sec"><h2>Báo cáo phân tích</h2>';
    if(!rs.length) out+='<div class="empty">Chưa có báo cáo. Nhắn trong cuộc trò chuyện để chạy phân tích sản phẩm cho học viên này.</div>';
    else out+=rs.map(function(r,i){
      return '<details class="rp"'+(i===0?' open':'')+'><summary>'+esc(r.title)+'</summary><div class="meta2">'+fmt(r.date)+(r.source?' · '+esc(r.source):'')+'</div><div class="body">'
        +(r.summary?'<p><strong>'+inl(r.summary)+'</strong></p>':'')+(r.charts||[]).map(chartHtml).join("")+mdLite(r.body)+'</div></details>';
    }).join("");
    return out+'</section>';
  }
  return out+secActivity(a);
}
function stat(v,l,c){return '<div class="stat '+c+'"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'}

/* ---------- render ---------- */
function render(){
  var t=today();
  $("#today").textContent="Hôm nay "+pad(t.getDate())+"/"+pad(t.getMonth()+1)+"/"+t.getFullYear();
  var m=/^#\/([\w-]+)(?:\/([\w-]+))?$/.exec(location.hash||"");
  var main=!m||MAIN.some(function(x){return x[0]===m[1]});
  $("#nav").innerHTML=main?mainNav(m?m[1]:"tong-quan"):"";
  $("#nav").hidden=!main;
  $("#app").innerHTML=main?viewTrack(m?m[1]:"tong-quan"):viewStudent(m[1],m[2]);
}
function safeRender(){
  // giữ nguyên các mục đang mở khi dữ liệu cập nhật trực tiếp
  var openIdx=[].map.call(document.querySelectorAll("#app details"),function(d){return d.open});
  var y=window.scrollY;
  render();
  [].forEach.call(document.querySelectorAll("#app details"),function(d,i){if(openIdx[i])d.open=true});
  window.scrollTo(0,y);
}
var toastT=null;
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},1800)}

async function copyMsg(msg){
  try{await navigator.clipboard.writeText(msg);toast("Đã sao chép, dán vào Zalo hoặc email")}catch(_){
    var ta=document.createElement("textarea");ta.value=msg;ta.style.cssText="position:fixed;left:-9999px";document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand("copy")}catch(__){} document.body.removeChild(ta);toast(ok?"Đã sao chép, dán vào Zalo hoặc email":"Trình duyệt chặn sao chép")}
}
document.addEventListener("click",async function(e){
  var t=e.target.closest("button"); if(!t)return; var d=t.dataset||{};
  if(d.copystep){
    var pr=d.copystep.split(":"), s1=students.filter(function(x){return x.id===pr[0]})[0], n1=+pr[1]; if(!s1)return;
    var a1=analyze(s1), p1=a1.pb[n1-1]; if(!p1)return; var sb=subs(n1,a1.mk);
    return copyMsg("Chào "+s1.name+", việc cho bước "+n1+"/"+a1.ns+": "+p1.name+"\n\nViệc cần làm:\n"+p1.task[a1.mk]
      +(sb.length?"\n\nĐầu việc:\n"+sb.map(function(it,i){return (i+1)+". "+it}).join("\n"):"")
      +"\n\nXong bước này khi: "+p1.done+"\n\nLịch họp: "+a1.meet+"\n\nVướng chỗ nào, nhắn mình trước buổi họp nhé.");
  }
  if(d.copyass){
    var x2=assignments.filter(function(x){return x.id===d.copyass})[0]; if(!x2)return;
    var s2=students.filter(function(x){return x.id===x2.studentId})[0]||{name:""};
    return copyMsg("Chào "+s2.name+", bài tập: "+x2.title+(x2.due?" (hạn "+fmt(x2.due)+(x2.dueTime?" "+x2.dueTime:"")+")":"")+"\n\n"
      +(x2.items||[]).map(function(it,i){return (i+1)+". "+it}).join("\n")+"\n\nVướng chỗ nào, nhắn mình trước buổi họp nhé.");
  }
  if(d.copy){
    var s0=students.filter(function(x){return x.id===d.copy})[0]; if(!s0)return;
    var a0=analyze(s0), p0=a0.cur<=a0.ns?a0.pb[a0.cur-1]:null, tt=today(), w0=new Date(tt); w0.setDate(w0.getDate()-((tt.getDay()+6)%7)); var w1=new Date(w0); w1.setDate(w1.getDate()+6);
    var msg="Chào "+s0.name+", việc cho tuần "+pad(w0.getDate())+"/"+pad(w0.getMonth()+1)+" – "+pad(w1.getDate())+"/"+pad(w1.getMonth()+1)+":\n\n"
      +(p0?"Bước hiện tại: "+a0.cur+"/"+a0.ns+", "+p0.name+"\n\nViệc cần làm:\n"+p0.task[a0.mk]+"\n\nXong bước này khi: "+p0.done:"Bạn đã hoàn tất "+a0.ns+" bước. Tuần này mình tổng kết và chốt kết thúc mentor.")
      +(a0.openAss.length?"\n\nBài đang giao:\n"+a0.openAss.map(function(x){return x.title+" (hạn "+fmt(x.due)+(x.dueTime?" "+x.dueTime:"")+")\n"+(x.items||[]).map(function(it,i){return (i+1)+". "+it}).join("\n")}).join("\n\n"):"")
      +(a0.lastHeld&&a0.lastHeld.actions?"\n\nViệc từ buổi họp trước:\n"+a0.lastHeld.actions:"")
      +"\n\nLịch họp: "+a0.meet+"\n\nVướng chỗ nào, nhắn mình trước buổi họp nhé.";
    copyMsg(msg);
  }
});

/* ---------- boot ---------- */
function showBanner(msg){var b=$("#banner");b.textContent=msg;b.hidden=false}
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
(async function(){
  render();
  var c=window.claude; if(!c||!c.use){showBanner("Không đọc được dữ liệu. Tải lại trang.");return}
  try{db=await c.use("db")}catch(_){db=null}
  if(!db){showBanner("Chưa kết nối được kho dữ liệu. Hãy đăng nhập và mở lại trang.");return}
  db.collection("students").onSnapshot(function(q){students=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});safeRender()},function(){showBanner("Mất kết nối dữ liệu. Tải lại trang.")});
  db.collection("assignments").onSnapshot(function(q){assignments=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});safeRender()},function(){});
  db.collection("reports").onSnapshot(function(q){reports=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});safeRender()},function(){});
  db.collection("logs").onSnapshot(function(q){logs=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});safeRender()},function(){});
  db.collection("meetings").onSnapshot(function(q){meetings=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});safeRender()},function(){});
})();
})();
</script>
