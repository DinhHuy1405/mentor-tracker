<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Theo dõi học viên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Giao diện theo thương hiệu landing huytim.com: nền ấm, mực đen, Fraunces cho tiêu đề, Inter cho nội dung.
   Viền mảnh 1px, bo góc 8-12px, màu trạng thái dịu. Chỉ có chế độ sáng (landing không có chế độ tối). */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#1a1a18; --muted:#45443f; --soft:#66655f; --line:#d9d6ce; --line2:#bdb9af;
  --accent:#141413; --accent-ink:#ffffff; --todo:#e3e1da;
  --ok:#1f7a45; --ok-bg:#e3f4ea; --warn:#7a5800; --warn-bg:#fdf1c7; --bad:#b3261e; --bad-bg:#fde4e1;
  --f-ok:#1a1a18; --f-warn:#c0392b; --f-bad:#c0392b; --done:#1fa25a; --done-bg:#e6f5ec; --info:#1a1a18; --info-bg:#f4f3ef;
  --field:#ffffff; --focus:#2563eb;
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Inter,system-ui,sans-serif;
  --r:12px; --rs:8px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.55;border-top:0;
  padding-inline:16px;padding-block:0 56px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
header.bar{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between;padding-block:22px 0;border-bottom:1px solid var(--line);margin-bottom:22px}
header.bar>div:first-child{padding-bottom:12px}
header.bar h1{font-family:var(--serif);font-size:22px;font-weight:700;margin:0;letter-spacing:-.005em;line-height:1.15}
header.bar .sub{color:var(--soft);font-size:13px;margin-top:3px}
nav.tabs{display:flex;gap:2px;background:none;padding:0}
nav.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Kiểu Notion cơ bản cho các trang quản lý của mentor (học viên không thấy) */
body.nt{--ink:#37352f;--muted:#5f5e5b;--soft:#787774;--line:#e9e9e7;--line2:#dfdfdd;--serif:var(--font);--r:4px;--rs:4px;font-size:15px;line-height:1.5}
body.nt .wrap{max-width:960px}
body.nt header.bar{border-bottom:0;padding-block:48px 0;margin-bottom:8px;display:block}
body.nt header.bar>div:first-child{padding-bottom:4px}
body.nt header.bar h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
body.nt header.bar .sub{font-size:13px;color:var(--soft);margin-top:4px}
body.nt nav.tabs{border-bottom:1px solid var(--line);margin:14px 0 24px;gap:0}
body.nt nav.tabs button{padding:6px 10px;margin-right:4px;font-size:14px;border-radius:4px 4px 0 0;color:var(--soft);font-weight:400}
body.nt nav.tabs button:hover{background:#f7f6f3;color:var(--ink)}
body.nt nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:500;border-bottom:2px solid var(--ink)}
body.nt h2,body.nt h3,body.nt .panel h3{font-family:var(--font);font-weight:600;letter-spacing:-.01em;color:var(--ink)}
body.nt .stats{border:0;border-radius:0;display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px;overflow:visible}
body.nt .stat{border:1px solid var(--line);border-radius:4px;margin:0;padding:10px 14px;min-width:130px;flex:1 1 130px}
body.nt .stat .v{font-family:var(--font);font-size:24px;font-weight:600}
body.nt .stat .l{font-size:12.5px;color:var(--soft)}
body.nt .stu,body.nt .panel,body.nt .side{border:1px solid var(--line);box-shadow:none;border-radius:4px}
body.nt .stu:hover{background:#f7f6f3}
body.nt .pill{border-radius:3px;padding:1px 7px;font-size:12.5px;font-weight:400}
body.nt .pill::before{display:none}
body.nt .pill.r1{background:#dbeddb;color:#1c3829}body.nt .pill.r2{background:#fdecc8;color:#402c1b}body.nt .pill.r3{background:#ffe2dd;color:#5d1715}body.nt .pill.r0{background:#e3e2e0;color:#32302c}
body.nt .btn{border-color:var(--line2);box-shadow:none;font-weight:400;padding:5px 11px}
body.nt .btn:hover,body.nt .add:hover{background:#efefed}
body.nt .btn.primary{background:#2383e2;border-color:#2383e2;color:#fff}
body.nt .btn.primary:hover{background:#0b6ec5;border-color:#0b6ec5}
body.nt .pick:hover{background:#efefed}body.nt .pick[aria-current="true"]{background:#efefed;box-shadow:none;font-weight:500}
body.nt a{text-underline-offset:3px;text-decoration-color:#c9c8c4}
body.nt tbody tr:hover,body.nt .step-row:hover,body.nt .mrow:hover{background:#f7f6f3}
body.nt details{border-top-color:var(--line)}
body.nt .sec{border-top:0;padding-top:0}
body.nt .stat{border-width:1px!important}
body.nt .tl2.red li,body.nt ul.red li{border-left:0;background:#fbe4e4;border-radius:4px;padding:8px 12px;margin:4px 0;list-style:none}
body.nt .tl2.red{padding-left:0}
.nsb[hidden]{display:none!important}
body.nt{padding-left:256px}
body.nt .wrap{max-width:900px}
body.nt nav.tabs.mainnav{display:none}
body.nt header.bar{padding-block:40px 0}
.nsb{position:fixed;left:0;top:0;bottom:0;width:240px;background:#f7f7f5;border-right:1px solid #e9e9e7;padding:14px 8px;overflow:auto;font-size:14px;color:#37352f}
.nsb .ws{display:flex;align-items:center;gap:8px;padding:6px 10px 12px;font-weight:600}
.nsb .ws i{width:20px;height:20px;border-radius:4px;background:#37352f;color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
.nsb h5{margin:14px 10px 4px;font-size:12px;font-weight:600;color:#9b9a97}
.nsb a{display:block;padding:4px 10px;border-radius:4px;color:#5f5e5b;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.7}
.nsb a:hover{background:#ebebe9}
.nsb a[aria-current="page"]{background:#e8e8e6;color:#37352f;font-weight:500}
.nsb-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e03e3e;margin-left:8px;vertical-align:1px}
.nsb a small{color:#9b9a97;margin-left:6px;font-size:12px}
@media (max-width:820px){
  body.nt{padding-left:16px}
  .nsb{position:static;width:auto;margin:0 -16px;border-right:0;border-bottom:1px solid #e9e9e7;padding:8px 10px;display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center}
  .nsb .ws,.nsb h5,.nsb .nsb-st{display:none}
  .nsb a{padding:2px 10px}
}
@media (max-width:600px){body.nt header.bar{padding-block:28px 0}body.nt header.bar h1{font-size:26px}}

/* Dải số liệu: một khối, chia bằng đường kẻ mảnh */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;margin:0 0 26px;padding:0}
.stat{background:var(--surface);padding:14px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stat .v{font-size:26px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35}
.stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)} .stat.ok .v{color:var(--ok)}

.markets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:28px;align-items:start}
.mk h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between;gap:12px}
.mk h2 span{font-weight:400;letter-spacing:0;text-transform:none;color:var(--soft)}
.list{display:flex;flex-direction:column;gap:14px}
.empty{color:var(--soft);padding:22px;border:1px dashed var(--line2);border-radius:var(--r);background:rgba(255,255,255,.5)}

.stu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:0 1px 2px rgba(20,20,19,.04)}
.stu .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.stu .nm{font-weight:600;font-size:15.5px}
.stu .pk{color:var(--soft);font-size:13px;margin-left:8px;font-weight:400}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:2px 10px 2px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.r1{background:var(--ok-bg);color:var(--ok)} .pill.r2{background:var(--warn-bg);color:var(--warn)}
.pill.r3{background:var(--bad-bg);color:var(--bad)} .pill.r0{background:var(--todo);color:var(--muted)}
.track{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:14px 0 10px}
.seg{height:22px;border-radius:4px;background:var(--todo);color:var(--soft);font-size:12px;font-weight:500;display:grid;place-items:center}
.seg.done{background:var(--accent);color:var(--accent-ink)}
.seg.cur{background:var(--surface);box-shadow:inset 0 0 0 2px currentColor;font-weight:600}
.seg.cur.r1{color:var(--f-ok)} .seg.cur.r2{color:var(--f-warn)} .seg.cur.r3{color:var(--f-bad)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px}
.meta .step{font-weight:600}
.meta .days{color:var(--muted)}
.why{margin-top:8px;font-size:14px;padding-left:10px;border-left:2px solid var(--line2)}
.why.r3{color:var(--bad);border-left-color:var(--f-bad)}.why.r2{color:var(--warn);border-left-color:var(--f-warn)}
.meet{margin-top:8px;font-size:14px;color:var(--muted)}.meet.none{color:var(--bad);font-weight:500}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;color:var(--ink);font-weight:600;font-size:14px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +";color:var(--soft)}
details[open] summary::after{content:" \2212"}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px 22px;margin-top:12px}
.cols h4{margin:0 0 4px;font-size:12px;color:var(--soft);font-weight:600}
.cols p{margin:0;white-space:pre-line;font-size:14.5px}
.cols .full{grid-column:1/-1}

/* Màn hình nhập liệu */
.edit{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.edit{grid-template-columns:1fr}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.side h3{margin:14px 8px 6px;font-size:12px;color:var(--soft);font-weight:600}
.side h3:first-child{margin-top:2px}
.pick{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:var(--rs);cursor:pointer;margin-bottom:2px}
.pick:hover{background:#f6f5f1} .pick[aria-current="true"]{background:#f1f0eb;color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--ink)}
.pick small{color:var(--soft)}
.add{width:100%;margin:6px 0 2px;border:1px solid var(--line2);background:var(--surface);border-radius:var(--rs);padding:7px;cursor:pointer;color:var(--ink);font-weight:500}
.add:hover{background:#f3f2ee;border-color:#b6b4ac}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.panel+.panel{margin-top:16px}
.panel h3{margin:0 0 14px;font-family:var(--serif);font-size:17px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px 16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
.f input,.f select,.f textarea,.row input,.row select,.row textarea{background:var(--field);border:1px solid var(--line2);border-radius:var(--rs);padding:8px 11px;color:var(--ink);width:100%;min-width:0;font-weight:400}
.f input,.f select,.row input,.row select{min-height:38px}
.f input:hover,.f select:hover,.f textarea:hover,.row input:hover,.row select:hover,.row textarea:hover{border-color:#b6b4ac}
.f input:focus,.f select:focus,.f textarea:focus,.row input:focus,.row select:focus,.row textarea:focus{border-color:var(--ink)}
.f textarea,.row textarea{resize:vertical;min-height:64px;line-height:1.5}
.f.wide{grid-column:1/-1}
.steps{display:flex;flex-direction:column}
.step-row{display:grid;grid-template-columns:28px minmax(0,1fr) 150px auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.step-row:first-child{border-top:0}
.step-row .n{font-weight:600;color:var(--soft)}
.step-row.done .n{color:var(--ink)}
.step-row .t small{display:block;color:var(--soft);font-size:13px}
@media (max-width:560px){.step-row{grid-template-columns:24px minmax(0,1fr);}.step-row input,.step-row .acts{grid-column:2}}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--rs);padding:7px 14px;cursor:pointer;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{background:#f3f2ee;border-color:#b6b4ac}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#2c2c2a;border-color:#2c2c2a}
.btn.danger{color:var(--bad);border-color:#e3b8b3} .btn.danger:hover{background:var(--bad-bg)} .btn.sm{padding:4px 10px;font-size:13px}
.acts{display:flex;gap:6px}
.mrow{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:10px}
.mrow .head{display:grid;grid-template-columns:150px 110px 150px minmax(0,1fr) auto;gap:8px;align-items:center}
@media (max-width:700px){.mrow .head{grid-template-columns:1fr 1fr}}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.note{color:var(--soft);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:9px 16px;border-radius:var(--rs);font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.show{opacity:1}
.banner{background:var(--surface);color:var(--muted);border:1px solid var(--line);border-left:3px solid var(--f-warn);padding:10px 14px;border-radius:var(--rs);margin-bottom:16px;font-size:14px}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:24px}

/* Màn hình đăng nhập */
.login-card{max-width:380px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 24px rgba(20,20,19,.06)}
.login-card h1{margin:0;font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.15}
.login-card p{margin:0;color:var(--muted)}
.login-card .btn.primary{height:42px;margin-top:4px}
.login-card #loginmsg{font-size:14px;color:var(--muted);min-height:1.3em}

/* Tổng quan bổ sung: rủi ro, việc cần xử lý, lịch tuần, phân bố bước, nhịp họp, bảng kiểm tra */
.sec{margin:0 0 34px}
.sec>h2{font-family:var(--serif);font-size:18px;font-weight:700;margin:0 0 4px}
.sec>.hint{color:var(--soft);font-size:13.5px;margin:0 0 12px}
.riskbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--todo);margin:-10px 0 6px}
.riskbar i{display:block}
.riskbar .r0{background:var(--line2)}.riskbar .r1{background:var(--f-ok)}.riskbar .r2{background:var(--f-warn)}.riskbar .r3{background:var(--f-bad)}
.rlegend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted);margin:0 0 28px}
.rlegend b{font-weight:600;color:var(--ink)}
.rlegend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line2)}
.rlegend .r1::before{background:var(--f-ok)}.rlegend .r2::before{background:var(--f-warn)}.rlegend .r3::before{background:var(--f-bad)}
.at{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.at-i{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 18px;padding:12px 18px;border-top:1px solid var(--line);border-left:3px solid var(--line2)}
.at-i:first-child{border-top:0}
.at-i.s3{border-left-color:var(--f-bad)}.at-i.s2{border-left-color:var(--f-warn)}.at-i.s1{border-left-color:var(--line2)}
.at-i .who strong{display:block}.at-i .who span{color:var(--soft);font-size:13px}
.at-i ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.at-i li{font-size:14.5px;color:var(--muted)}.at-i li.s3{color:var(--bad);font-weight:500}.at-i li.s2{color:var(--warn);font-weight:500}
@media (max-width:640px){.at-i{grid-template-columns:1fr}}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.wk+.wk{margin-top:14px}
.wkh{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:6px;min-width:760px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--rs);padding:8px 9px;min-height:84px}
.day.past{background:#fbfaf8}.day.today{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .dn{font-size:12.5px;font-weight:600;color:var(--soft);margin-bottom:6px}.day.today .dn{color:var(--ink)}
.day .none{font-size:13px;color:var(--line2)}
.mt{font-size:13.5px;font-weight:500;padding:4px 6px;border-radius:5px;margin-bottom:4px;line-height:1.3}
.mt small{display:block;font-weight:400;font-size:12px;opacity:.85}
.mt.up{background:var(--todo);color:var(--ink)}.mt.held{background:var(--ok-bg);color:var(--ok)}.mt.oth{background:var(--warn-bg);color:var(--warn)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:34px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.two>*,.sec,.scrollx{min-width:0}
.dist{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 22px;gap:2px 10px;align-items:center;margin-bottom:8px}
.dist .lb{font-size:14px;color:var(--muted)}
.dist .bar{height:14px;background:var(--todo);border-radius:4px;overflow:hidden}
.dist .bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.dist .ct{font-weight:600;text-align:right}
.dist .who{grid-column:2/4;font-size:13px;color:var(--soft);margin-top:-2px}
.rg{display:grid;gap:4px;align-items:center;min-width:420px}
.rg .h{font-size:12px;color:var(--soft);text-align:center}
.rg .nm{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg .c{height:24px;border-radius:4px;background:transparent;border:1px dashed var(--line)}
.rg .c.held{background:var(--ink);border-color:var(--ink)}.rg .c.sched{background:var(--surface);border:2px solid var(--ink)}
.rg .c.miss{background:var(--bad-bg);border:1px solid #e3b8b3}.rg .c.off{border-color:transparent}
.rlg2{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted);margin-top:8px}
.rlg2 i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px;min-width:860px}
.tbl th{font-size:12px;color:var(--soft);font-weight:600;text-align:left;padding:10px 12px;background:#faf9f6;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:first-child td{border-top:0}
.tbl .w{color:var(--bad);font-weight:500}.tbl .m{color:var(--soft)}.tbl .o{color:var(--ok);font-weight:500}
.contact{margin-top:6px;font-size:13.5px;color:var(--muted)}.contact.none{color:var(--warn)}
.goal{margin-top:6px;font-size:14px}.goal b{font-weight:600}

/* ===== Giao diện Theo dõi v2: sổ theo dõi, ít khung, chữ làm chủ đạo ===== */
.brief{display:flex;flex-wrap:wrap;border-top:1px solid var(--line2);border-bottom:1px solid var(--line);margin:0 0 14px;background:none}
.fig{flex:1 1 130px;padding:16px 18px 14px 0;min-width:0}
.fig+.fig{padding-left:18px;border-left:1px solid var(--line)}
.fig b{display:block;font-family:var(--serif);font-weight:700;font-size:38px;line-height:1;letter-spacing:-.025em}
.fig span{display:block;font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.35}
.fig.bad b{color:var(--bad)}.fig.warn b{color:var(--warn)}.fig.ok b{color:var(--ok)}
@media (max-width:640px){.fig{flex:1 1 44%;border-left:0!important;padding-left:0!important}}
.riskbar{display:flex;height:6px;border-radius:0;overflow:hidden;background:var(--todo);margin:0 0 8px}
.rlegend{margin:0 0 34px}
.rlegend span::before{border-radius:1px;width:8px;height:8px}
.sec{border-top:1px solid var(--line);padding-top:22px;margin:0 0 38px}
.sec>h2{font-family:var(--serif);font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
.sec>.hint{color:var(--soft);font-size:14px;margin:0 0 16px;max-width:62ch}

/* Việc cần xử lý: danh sách chữ, không khung */
.atl{display:flex;flex-direction:column}
.ai{display:grid;grid-template-columns:210px minmax(0,1fr);gap:6px 24px;padding:14px 0;border-top:1px solid var(--line)}
.ai:first-child{border-top:0;padding-top:4px}
.ai .who b{display:block;font-weight:600;font-size:15px}.ai .who span{color:var(--soft);font-size:13.5px}
.ai ul{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.ai li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;font-size:15px}
.ai li em{font-style:normal;font-size:12px;font-weight:600;padding-top:2px;color:var(--soft)}
.ai li.s3 em{color:var(--bad)}.ai li.s2 em{color:var(--warn)}
.ai li.s3{font-weight:500}
@media (max-width:640px){.ai{grid-template-columns:1fr;gap:4px}}

/* Danh sách học viên theo hàng */
.ros .gt{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--ink);padding:18px 0 8px;border-bottom:1px solid var(--ink)}
.ros .gt span{font-weight:400;letter-spacing:0;text-transform:none;color:var(--soft)}
.ros .gt:first-of-type{padding-top:4px}
.ros .hd,.rw{display:grid;grid-template-columns:minmax(150px,1.15fr) minmax(210px,2fr) 124px minmax(150px,1.25fr) 120px;gap:6px 26px;align-items:start}
.ros .hd{padding:10px 0 6px;font-size:12px;color:var(--soft);font-weight:600}
.rw{padding:16px 0 14px;border-top:1px solid var(--line)}
.rw .nm{font-weight:600;font-size:15.5px;line-height:1.3}
.rw .sb{color:var(--muted);font-size:13.5px;margin-top:2px}
.rw .ct{color:var(--soft);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}.rw .ct.none{color:var(--warn)}
.ruler{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;height:10px;margin-top:5px}
.ruler i{display:block;background:var(--todo);border-radius:1px}
.ruler i.d{background:var(--ink)}
.ruler i.c.r0,.ruler i.c.r1{background:var(--f-ok)}.ruler i.c.r2{background:var(--f-warn)}.ruler i.c.r3{background:var(--f-bad)}
.stp{margin-top:8px;font-weight:500;font-size:14.5px}
.rw .why{margin-top:5px;font-size:13.5px;padding:0;border:0;color:var(--muted)}
.rw .why.r3{color:var(--bad)}.rw .why.r2{color:var(--warn)}
.dd{font-size:14.5px;color:var(--muted)}.dd b{color:var(--ink);font-size:20px;font-weight:600;letter-spacing:-.02em;margin-right:2px}
.gauge{position:relative;height:3px;background:var(--todo);margin-top:9px}
.gauge i{display:block;height:100%;background:var(--f-ok)}
.gauge.r2 i{background:var(--f-warn)}.gauge.r3 i{background:var(--f-bad)}
.gauge::after{content:"";position:absolute;left:66.67%;top:-3px;bottom:-3px;width:1px;background:var(--ink)}
.rw .c4{font-size:14.5px;color:var(--muted)}.rw .c4.none{color:var(--bad);font-weight:500}
.st{font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.st::before{content:"";width:8px;height:8px;border-radius:1px;background:var(--line2)}
.st.r1{color:var(--ok)}.st.r1::before{background:var(--f-ok)}.st.r2{color:var(--warn)}.st.r2::before{background:var(--f-warn)}.st.r3{color:var(--bad)}.st.r3::before{background:var(--f-bad)}.st.r0{color:var(--muted)}
.rw details{grid-column:1/-1;margin-top:6px;border-top:0;padding-top:0}
.rw summary{font-size:13.5px;font-weight:500;color:var(--muted)}
.rw summary:hover{color:var(--ink)}
.rw .cols{padding:12px 0 2px;border-top:1px solid var(--line);margin-top:8px}
@media (max-width:900px){
  .ros .hd{display:none}
  .rw{grid-template-columns:1fr 1fr;gap:8px 18px}
  .rw .c2{grid-column:1/-1;order:3}.rw .c1{grid-column:1/2}.rw .c5{grid-column:2/3;justify-self:end}
  .rw .c3{order:4}.rw .c4{order:5}
}
@media (max-width:520px){.rw .c3,.rw .c4{grid-column:1/-1}}

/* Lịch tuần: lưới đường kẻ, không khung */
.week{min-width:760px;gap:0;border-top:1px solid var(--ink)}
.day{background:none;border:0;border-left:1px solid var(--line);border-radius:0;padding:8px 10px 10px;min-height:92px}
.day:first-child{border-left:0;padding-left:0}
.day.past{background:none}.day.past .dn{color:var(--line2)}
.day.today{box-shadow:none;border-color:var(--line);background:#fff}
.day.today .dn{color:var(--ink)}.day.today .dn::after{content:" · hôm nay";font-weight:400;color:var(--soft)}
.mt{background:none!important;padding:0;margin:0 0 7px;font-size:14px;font-weight:500;color:var(--ink)!important;display:block;border-radius:0}
.mt::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border:1.5px solid var(--ink);vertical-align:0}
.mt.held::before{background:var(--ink)}.mt.oth::before{border-color:var(--f-warn);background:var(--f-warn)}

.mt.oth small{color:var(--warn)}
.wkh{border:0;color:var(--ink);font-weight:600}

/* Biểu đồ: mảnh hơn */
.dist .bar{height:8px;border-radius:0;background:var(--todo)}.dist .bar i{border-radius:0}
.dist .ct{font-family:var(--serif);font-weight:700;font-size:16px}
.rg .c{border-radius:1px}.rg .c.sched{border-width:1.5px}

/* Bảng kiểm tra */
.tbl{border:0;border-top:1px solid var(--ink);border-radius:0;background:none}
.tbl th{background:none;border-bottom:1px solid var(--line);padding:10px 12px 8px 0}
.tbl td{padding:12px 12px 12px 0}

/* Biểu đồ: dòng thời gian, phễu, tốc độ, so với chuẩn */
.tl{width:100%;min-width:760px;display:block;overflow:visible}
.tl text{font-family:var(--font);font-size:13px;fill:var(--muted)}
.tl .nm{fill:var(--ink);font-weight:600;font-size:14px}

.tl .today{fill:var(--ink);font-size:12px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:8px;margin-right:6px;vertical-align:0}
.legend i.dot{width:9px;height:9px;border-radius:50%}
.fun{display:grid;grid-template-columns:minmax(0,175px) minmax(0,1fr) 92px;gap:0 12px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.fun:first-of-type{border-top:0}

.bul{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 78px;gap:0 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bul:first-of-type{border-top:0}
.bul .lb{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bul .tr{position:relative;height:10px;background:var(--todo)}
.bul .tr i{display:block;height:100%;background:var(--f-ok)}
.bul.r2 .tr i{background:var(--f-warn)}.bul.r3 .tr i{background:var(--f-bad)}
.bul .tr b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.bul .nu{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.vel{display:flex;align-items:flex-end;gap:10px;height:120px;border-bottom:1px solid var(--ink);padding-top:6px}
.vel .g{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.vel .bars{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.vel .bars i{font-style:normal;display:block;width:44%;max-width:20px;position:relative}
.vel .bars i.a{background:var(--ink)}.vel .bars i.b{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink)}
.vel .bars i span{position:absolute;left:50%;transform:translateX(-50%);top:-15px;font-size:12px;font-weight:600;color:var(--ink)}
.velx{display:flex;gap:10px;margin-top:4px}
.velx div{flex:1;min-width:26px;text-align:center;font-size:12px;color:var(--soft)}
.ass{margin-top:6px;font-size:14px;color:var(--muted)}.ass.soon{color:var(--warn)}.ass.late{color:var(--bad);font-weight:500}

/* Trang riêng từng học viên */
.back{display:inline-block;font-size:14px;color:var(--muted);text-decoration:none;margin:0 0 14px}
.back:hover{color:var(--ink)}
.sp-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;align-items:flex-end;margin:0 0 6px}
.sp-h h2{font-family:var(--serif);font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:0}
.sp-sub{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.sp-sub span+span::before{content:" · ";color:var(--soft)}
.rw .nm a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line2)}
.rw .nm a:hover{border-bottom-color:var(--ink)}
.al{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.al li{font-size:15px;padding-left:12px;border-left:2px solid var(--line2)}
.al li.s3{color:var(--bad);border-left-color:var(--f-bad);font-weight:500}.al li.s2{color:var(--warn);border-left-color:var(--f-warn);font-weight:500}
.stl{display:grid;grid-template-columns:32px minmax(0,1.3fr) 120px minmax(0,1.6fr);gap:4px 16px;padding:10px 0;border-top:1px solid var(--line);align-items:start;font-size:14.5px}
.stl:first-child{border-top:0}
.stl .n{font-family:var(--serif);font-weight:700;color:var(--soft)}
.stl.d .n{color:var(--ink)}.stl.c{background:#fff;margin:0 -10px;padding-inline:10px;border-top-color:var(--ink)}
.stl .st2{color:var(--muted)}.stl.d .st2{color:var(--ok);font-weight:500}.stl.c .st2{font-weight:600;color:var(--ink)}
.stl .dn2{color:var(--soft);font-size:13.5px}
@media (max-width:640px){.stl{grid-template-columns:28px minmax(0,1fr)}.stl .st2,.stl .dn2{grid-column:2}}
.spair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px 34px}
.spair h4,.rp h4,.as h4{margin:0 0 4px;font-size:12px;color:var(--soft);font-weight:600}
.spair p{margin:0;white-space:pre-line;font-size:15px}
.as{padding:14px 0;border-top:1px solid var(--line)}.as:first-of-type{border-top:0;padding-top:0}
.as .t{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.as .t b{font-size:15px}.as .t span{font-size:13.5px;color:var(--muted)}.as .t span.late{color:var(--bad);font-weight:600}.as .t span.ok{color:var(--ok);font-weight:600}
.as ol{margin:8px 0 0;padding-left:20px;display:grid;gap:3px;font-size:15px}
.as .nt{margin-top:6px;font-size:14px;color:var(--muted)}
.as .rv2{margin-top:10px;padding:8px 0 8px 12px;border-left:3px solid var(--info);background:#fff}
.as .rv2 h4{color:var(--info)}
.as .rv2 .ri{font-size:14.5px;margin-top:4px}.as .rv2 .ri em{font-style:normal;color:var(--soft);font-size:13px;margin-right:6px}
.as-grp{margin:18px 0 6px;font-size:12px;color:var(--soft);font-weight:600}.as-grp:first-of-type{margin-top:0}
.wk{margin:0 0 22px;border:1px solid var(--line);background:#fff;padding:0 16px 8px}
.wk-h{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin:0 -16px 8px;padding:10px 16px;background:var(--todo);border-bottom:1px solid var(--line)}
.wk-h b{font-family:var(--serif);font-size:16px}.wk-h span{font-size:13.5px;color:var(--muted)}.wk-h em{font-style:normal;margin-left:auto;font-size:13px;font-weight:600;color:var(--muted)}
.wk-h.cur{background:var(--info-bg)}.wk-h.cur em{color:var(--info)}.wk-h.ok{background:var(--done-bg)}.wk-h.ok em{color:var(--ok)}
.wk .as{padding:12px 0 12px 12px;border-top:1px solid var(--line);border-left:3px solid var(--line);margin-top:8px}
.wk .as.s-ok{border-left-color:var(--ok);background:var(--done-bg)}.wk .as.s-sub{border-left-color:var(--f-ok)}.wk .as.s-fix{border-left-color:var(--f-warn)}.wk .as.s-late{border-left-color:var(--f-bad)}
.pill{padding:1px 8px;font-size:12.5px;font-weight:600;border:1px solid var(--line);color:var(--muted);background:#fff}
.pill.ok{color:#fff;background:var(--done);border-color:var(--ok)}.pill.sub{color:var(--info);border-color:var(--f-ok)}.pill.fix{color:var(--warn);border-color:var(--f-warn)}.pill.late{color:var(--bad);border-color:var(--f-bad)}
.blk{margin:10px 0;padding-top:8px;border-top:1px dashed var(--line)}.blk h4{margin:0 0 6px;font-size:12px;color:var(--soft);font-weight:600}
.blk p{margin:3px 0;font-size:14.5px}.blk.sbm a{color:var(--info)}
.cpy{margin-top:10px}
.acct{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;margin:0 0 14px;padding:12px 16px;background:var(--info-bg);border:1px solid #c5d4f5;border-radius:var(--rs)}
.acct h4{margin:0 0 6px;font-size:12px;color:var(--info);font-weight:600}
.acct p{margin:2px 0;font-size:15px}.acct p span{display:inline-block;width:84px;color:var(--muted)}.acct .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px}.acct .none{color:var(--muted)}
.stc{background:#fff;border:1px solid var(--line);padding:10px 14px}
.mt{padding:6px 0 6px 10px;border-left:3px solid var(--line);margin-bottom:6px;font-size:14.5px}.mt.ok{border-left-color:var(--ok)}.mt b{margin-right:10px}.mt span{font-size:13px;color:var(--muted)}.mt.ok span{color:var(--ok);font-weight:600}
.mm{padding:12px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 20px;font-size:14.5px}
.mm:first-of-type{border-top:0;padding-top:0}
.mm .d b{display:block;font-weight:600}.mm .d span{color:var(--soft);font-size:13.5px}
.mm p{margin:0 0 3px;white-space:pre-line}.mm a{color:var(--ink)}
@media (max-width:640px){.mm{grid-template-columns:1fr}}
.an{border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:0 0 18px;background:var(--surface);min-width:0}
.an>small{color:var(--soft)} .an h3{font-family:var(--serif);font-size:16px;margin:2px 0 10px;color:var(--muted);font-weight:600}
.vd{font-size:19px;font-weight:700;line-height:1.35;margin:0 0 14px;padding:12px 14px;background:#fff3a3;border-left:5px solid #f2b705;border-radius:var(--rs)}
.vzs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.vz{border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;min-width:0}
.vz .ck2{margin:0 0 8px;font-weight:600;font-size:15px}
.vz h4{margin:10px 0 0;font-size:12px;color:var(--soft);font-weight:400}
.dn2{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn2 svg{width:130px;height:130px;flex:none}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:14px;min-width:0;flex:1}

.dl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hlt{background:#fff3a3;padding:1px 9px;border-radius:99px;font-size:13px;font-weight:600;margin-left:8px;letter-spacing:0}
details.more{margin-top:12px;border:1px solid var(--line);border-radius:var(--rs);padding:10px 14px;background:var(--surface)}

.chip2{font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;background:#fff3a3;color:var(--ink)}

.dl2{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.vz .ck2{background:#fff3a3;display:inline-block;padding:3px 9px;border-radius:var(--rs)}
.vz .rcr{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0}

.vz .rcr.hi .rt2 i{background:#f2b705}.vz .rcr.bad .rt2 i{background:var(--f-bad)}
.dl span{white-space:normal;overflow:visible}.dl li{align-items:start}
.tb{margin-top:12px;border-top:1px dashed var(--line2);padding-top:10px;font-size:14.5px}

/* ---- Trình chiếu: handoff "VNM tropical editorial" (dán theo handoff, thêm tiền tố .dkp; viền chỉnh bằng --bw) ---- */

@font-face{font-family:'VNMD';src:local('VNM Sans Display Regular'),url('files/fonts/VNM-Sans-Display-Regular.otf');font-weight:400}
@font-face{font-family:'VNMS';src:local('VNM Sans Std'),url('files/fonts/VNM-Sans-Std.otf');font-weight:400}
.dk{max-width:1000px;min-width:0}
.dkp{--cobalt:#0213B0;--cream:#FFF6E5;--cocoa:#2D190F;--terra:#D85B38;--mango:#F4B940;--leaf:#2F9B62;--aqua:#46AFC2;--dragon:#E8789A;--bw:.75pt;--sh:.7mm;
  font-family:'VNMS','VNMD',var(--font);color:var(--cocoa);font-size:12.5pt;line-height:1.55;min-width:0}
.dkp *{box-sizing:border-box;margin:0;padding:0}
.dkv{position:relative;width:100%;overflow:hidden;border-radius:6px}
.dkp .page{width:297mm;height:167mm;padding:11mm 16mm 12mm;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--cream);display:flex;flex-direction:column}
.dkp .page.port{width:160mm;height:215mm;padding:11mm 10mm 12mm}
.dkp .page.blue{background:var(--cobalt);color:var(--cream)}
.dkp h1,.dkp h2,.dkp h3,.dkp .disp{font-family:'VNMD',var(--font);font-weight:700;line-height:1.1}
.dkp .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5mm;flex:none}
.dkp .pill{display:inline-block;font-family:'VNMD',var(--font);font-weight:700;font-size:10pt;padding:2mm 4.5mm;border:var(--bw) solid var(--cocoa);border-radius:20mm;background:var(--mango);color:var(--cocoa)}
.dkp .pill.w{background:var(--cream)}
.dkp .rule{height:3pt;background:var(--terra);width:38mm;margin:3mm 0 5mm;border-radius:2pt;flex:none}
.dkp h2{font-size:27pt;color:var(--cobalt);flex:none}
.dkp .pbody{flex:1;min-height:0;overflow:auto;padding:0 2mm 2mm 0}
.dkp p{margin:2mm 0}
.dkp .card{background:#fff;border:var(--bw) solid var(--cocoa);border-radius:6mm;box-shadow:var(--sh) var(--sh) 0 var(--cocoa);padding:4mm 5.5mm;margin:3mm 0 4.5mm}
.dkp .card.m{background:var(--mango)}
.dkp .lbl{font-family:'VNMD',var(--font);font-weight:700;font-size:9.5pt;color:var(--terra);letter-spacing:.3pt}
.dkp .card.m .lbl{color:var(--cocoa)}
.dkp .big{font-family:'VNMD',var(--font);font-weight:700;font-size:44pt;line-height:1.02}
.dkp .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:9pt;opacity:.75;border-top:1pt solid rgba(45,25,15,.35);padding-top:2mm;flex:none}
.dkp .blue .foot,.dkp .page.blue .foot{border-top-color:rgba(255,246,229,.4)}
.dkp .chip{display:inline-block;border:var(--bw) solid var(--cocoa);border-radius:3mm;padding:.8mm 3mm;font-family:'VNMD',var(--font);font-weight:700;font-size:9.5pt;margin-right:2mm;background:#fff;color:var(--cocoa);white-space:nowrap}
.dkp .chip.i{background:var(--mango)}.dkp .chip.v{background:var(--aqua)}.dkp .chip.n{background:var(--leaf);color:#fff}
.dkp .note{border-left:4pt solid var(--terra);padding:1mm 0 1mm 4mm;margin:3mm 0;font-size:10.5pt}
.dkp .row{display:grid;grid-template-columns:20mm 1fr;gap:5mm;align-items:stretch;margin:2.8mm 0}
.dkp .row .n{border:var(--bw) solid var(--cocoa);border-radius:6mm;box-shadow:var(--sh) var(--sh) 0 var(--cocoa);display:flex;align-items:center;justify-content:center;font-family:'VNMD',var(--font);font-weight:700;font-size:22pt;background:var(--mango)}
.dkp .row .n.c1{background:var(--aqua)}.dkp .row .n.c2{background:var(--terra);color:#fff}.dkp .row .n.c3{background:var(--leaf);color:#fff}.dkp .row .n.c4{background:var(--dragon)}
.dkp .row .b{border:var(--bw) solid var(--cocoa);border-radius:6mm;box-shadow:var(--sh) var(--sh) 0 var(--cocoa);background:#fff;padding:2.6mm 6mm;display:flex;flex-direction:column;justify-content:center;min-width:0;overflow-wrap:anywhere}
.dkp .row .b .t{font-family:'VNMD',var(--font);font-weight:700;font-size:17pt;color:var(--cobalt);line-height:1.1}
.dkp .row .b .q{font-size:11.5pt;margin-top:1mm}
.dkp .row .b .t+.q{margin-top:1mm}
.dkp .row .b .q:first-child{margin-top:0;font-size:12.5pt}
.dkp .row .b .o{font-size:11pt;margin-top:1.5mm;padding-top:1.5mm;border-top:1.2pt dashed var(--cocoa)}
.dkp .row .b .rst{align-self:flex-start;margin-top:1.5mm}
.dkp .mapg{display:grid;grid-template-columns:1fr 1fr;column-gap:7mm}
.dkp .page.port .mapg{grid-template-columns:1fr}
.dkp .row.mapr{grid-template-columns:12mm 1fr;margin:2mm 0;gap:3mm}
.dkp .row.mapr .n{font-size:14pt;border-radius:4mm}
.dkp .row.mapr .b{flex-direction:row;align-items:center;justify-content:space-between;gap:3mm;padding:1.8mm 4mm;border-radius:4mm}
.dkp .row.mapr .q{font-size:10.5pt;margin:0}
.dkp .row.mapr .rst{margin:0;align-self:center}
.dkp .dense .row{margin:1.5mm 0;grid-template-columns:15mm 1fr;gap:4mm}
.dkp .dense .row .n{font-size:16pt;border-radius:4mm}
.dkp .dense .row .b{padding:1.4mm 5mm;border-radius:4mm}
.dkp .dense .row .b .t{font-size:13.5pt}.dkp .dense .row .b .q{font-size:10.5pt;margin-top:.4mm}.dkp .dense .row .b .q:first-child{font-size:11.5pt}
.dkp .dense+.note{margin:2mm 0}
.dkp .row.cur .b{background:#FFF1CC;border-style:dashed}
.dkp .q strong,.dkp .q b{color:var(--cobalt);font-weight:700;background:linear-gradient(transparent 60%,#FFF1CC 60%)}
.dkp .formula{background:var(--cobalt);color:var(--cream);border:var(--bw) solid var(--cocoa);border-radius:5mm;box-shadow:var(--sh) var(--sh) 0 var(--cocoa);padding:3.5mm 5mm;margin:3mm 0;font-family:'VNMD',var(--font);font-weight:700;font-size:12pt;line-height:1.35}
.dkp .formula small{display:block;font-family:'VNMS',var(--font);font-weight:400;font-size:9.5pt;opacity:.9;margin-top:1.2mm}
.dkp .ex{background:#FFF1CC;border:var(--bw) dashed var(--cocoa);border-radius:5mm;padding:3mm 4.5mm;margin:3mm 0;font-size:10pt}
.dkp .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm;margin-top:9mm}
.dkp .sum>div{border:var(--bw) solid var(--cocoa);border-radius:5mm;box-shadow:var(--sh) var(--sh) 0 var(--cocoa);padding:3.5mm 5mm;background:var(--cream);color:var(--cocoa);min-width:0;overflow-wrap:anywhere}
.dkp .sum>div:nth-child(2){background:var(--mango)}
.dkp .sum .lbl{display:block;margin-bottom:1mm}.dkp .sum .v{font-family:'VNMD',var(--font);font-weight:700;font-size:13pt;line-height:1.2}
.dkp .page.port .sum{grid-template-columns:1fr}
.dkp .page.blue .big{margin-top:6mm}
.dkp .page.blue .lead{color:var(--cream)}
.dkp .lead{font-size:15pt;margin:2mm 0 0;font-family:'VNMD',var(--font);font-weight:700}
.dkctl{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.dkctl select{border:1.2px solid #2D190F;border-radius:99px;padding:8px 14px;background:#fff;color:#2D190F;font:inherit;font-weight:700;font-size:14px;max-width:100%}
.dkct{font-size:13px;color:#2D190F;opacity:.7}
.dk .btn{border:1.2px solid #2D190F;border-radius:99px;background:#fff;color:#2D190F;font-weight:700;padding:8px 16px;box-shadow:2px 2px 0 #2D190F}
.dk .btn:hover{background:#F4B940}
.dk .dk-nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.dk .dk-nav .btn:disabled{opacity:.35;box-shadow:none;cursor:default}
.dk:fullscreen{max-width:none;padding:24px;display:flex;flex-direction:column;background:#FFF6E5}
.vd strong{background:#fff3a3;padding:0 3px;border-radius:3px;font-weight:700}
/* Trình chiếu: chữ nhỏ trong thiết kế A4 cần to hơn khi xem trên màn hình */
.dk{max-width:100%}
.dkp .dense2 .row{margin:.9mm 0;grid-template-columns:12mm 1fr;gap:3mm}
.dkp .dense2 .row .n{font-size:13pt;border-radius:3mm}
.dkp .dense2 .row .b{padding:.8mm 4mm;border-radius:3mm}
.dkp .dense2 .row .b .q{font-size:11pt;margin-top:0}.dkp .dense2 .row .b .q:first-child{font-size:11.5pt}
.dkp .dense2 .row .b .t{font-size:12.5pt}
.dkp .dense2+.note,.dkp .dense2 ~ .note{margin:1.5mm 0}
.dkp .pill{font-size:13pt;padding:1.6mm 5mm}
.dkp .top span:last-child{font-size:12pt!important}
.dkp .lbl{font-size:12.5pt}
.dkp .chip{font-size:12.5pt}
.dkp .foot{font-size:10.5pt}
.dkp .sum .v{font-size:16pt}
.dkp .row .b .q{font-size:13pt}
.dkp .row .b .q:first-child{font-size:14pt}
.dkp .dense .row .b .q{font-size:12pt}.dkp .dense .row .b .q:first-child{font-size:13pt}
.dkp .dense .row .b .t{font-size:15pt}
.dkp .row .b .t{font-size:18pt}
.dkp .note{font-size:12pt}
.dkp .formula{font-size:14pt}.dkp .formula small{font-size:11pt}
.dkp .lead{font-size:17pt}
.dkp .row.mapr .q{font-size:12pt}
.dkctl select{font-family:'VNMS',Inter,sans-serif;font-weight:400;font-size:15px}
.dkp{font-synthesis:none}
.dkp .q strong,.dkp .q b{font-weight:400}
/* Trình chiếu: chỉ dùng 4 màu (cobalt, kem, cacao, mango) */
.dkp .rule{background:var(--mango)}
.dkp .lbl{color:rgba(45,25,15,.7)}
.dkp .card.m .lbl{color:var(--cocoa)}
.dkp .note{border-left-color:var(--mango)}
.dkp .row .n.c1,.dkp .row .n.c2,.dkp .row .n.c3,.dkp .row .n.c4{background:var(--mango);color:var(--cocoa)}
.dkp .chip.n{background:var(--cobalt);color:var(--cream)}.dkp .chip.v{background:var(--mango)}
.dkp .page.blue .rule{background:var(--mango)}
.dkp .sum>div:nth-child(2){background:var(--mango)}
.nextm{margin:2px 0 14px;color:var(--muted);font-size:15px}.nextm b{color:var(--ink)}
/* ---- Trang học viên kiểu Notion ---- */
.ntn{max-width:900px;margin:0 auto;color:#37352F;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif,"Segoe UI Emoji","Segoe UI Symbol";font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.ntn *{box-sizing:border-box}
.ntn-bc{font-size:14px;color:rgba(55,53,47,.65);margin:6px 0 18px}.ntn-bc b{font-weight:500;color:#37352F}
.ntn-h1{font-size:40px;font-weight:700;line-height:1.2;margin:0 0 14px;letter-spacing:-.01em;color:#37352F}
.ntn-h2{font-size:24px;font-weight:600;line-height:1.3;margin:34px 0 10px;color:#37352F;padding-bottom:4px;border-bottom:1px solid rgba(55,53,47,.09)}
.ntn-props{display:grid;gap:2px;margin:0 0 14px;font-size:14.5px}
.ntn-props>div{display:grid;grid-template-columns:130px 1fr;gap:8px;align-items:center;min-height:32px;padding:2px 0}
.ntn-props i.tg{justify-self:start}
.ntn-props span{color:rgba(55,53,47,.65)}.ntn-props b{font-weight:500}
.ntn-props a{color:#37352F;text-decoration:underline;text-decoration-color:rgba(55,53,47,.4);text-underline-offset:2px;margin-left:8px}
.ntn-tabs{display:flex;gap:2px;border-bottom:1px solid rgba(55,53,47,.16);margin:10px 0 6px}
.ntn-tabs a{padding:8px 12px;font-size:15px;color:rgba(55,53,47,.65);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:4px 4px 0 0}
.ntn-tabs a:hover{background:rgba(55,53,47,.06)}
.ntn-tabs a[aria-current="page"]{color:#37352F;font-weight:500;border-bottom-color:#37352F}
.tg{display:inline-block;vertical-align:middle;font-style:normal;font-size:13.5px;line-height:1.5;padding:0 8px;border-radius:4px;background:rgba(227,226,224,.5);color:#32302C;white-space:nowrap}
.tg.gr{background:#DBEDDB;color:#1C3829}.tg.y{background:#FDECC8;color:#402C1B}.tg.b{background:#D3E5EF;color:#183347}.tg.r{background:#FFE2DD;color:#5D1715}.tg.g{background:#E3E2E0}
.ntn-tb{width:100%;border-collapse:collapse;font-size:15px}
.ntn-tb th{text-align:left;font-weight:400;font-size:13.5px;color:rgba(55,53,47,.65);padding:6px 8px;border-bottom:1px solid rgba(55,53,47,.09);border-top:1px solid rgba(55,53,47,.09)}
.ntn-tb td{height:38px;padding:4px 8px;border-bottom:1px solid rgba(55,53,47,.09);vertical-align:middle}
.ntn-tb tbody tr{cursor:pointer}.ntn-tb tbody tr:hover{background:rgba(55,53,47,.04)}
.ntn-tb .c1{width:34px;color:rgba(55,53,47,.5)}.ntn-tb .c4{width:90px;color:rgba(55,53,47,.65)}
.ntn-tg{margin:2px 0;border-radius:4px}
.ntn-tg>summary{display:flex;align-items:center;gap:8px;padding:6px 6px;cursor:pointer;list-style:none;font-size:18px;font-weight:600;border-radius:4px}
.ntn-tg>summary::after,.ntn-tg[open]>summary::after{content:none!important}
.ntn-tg>summary::-webkit-details-marker{display:none}.ntn-tg>summary::marker{content:""}
.ntn-tg>summary:hover{background:rgba(55,53,47,.06)}
.ntn-tg .ar{width:0;height:0;border-left:7px solid rgba(55,53,47,.55);border-top:5px solid transparent;border-bottom:5px solid transparent;margin:0 4px 0 2px;transition:transform .12s;flex:none}
.ntn-tg[open]>summary .ar{transform:rotate(90deg)}
.ntn-tg .nn{color:rgba(55,53,47,.5);font-weight:500;min-width:18px}
.ntn-tg .nt{flex:1;min-width:0}
.ntn-tg>summary .tg{font-weight:400}
.ntn-bd{padding:4px 0 14px 34px}
.st-done .gt-nd{background:#2F9B62;border-color:#2F9B62;color:#fff}
.st-cur .gt-nd{border:3px solid #37352F;background:#37352F;box-shadow:0 0 0 4px #fff,0 0 0 7px #37352F}
.st-todo .gt-d>summary .nt{color:rgba(55,53,47,.5);font-weight:500}
.dl{display:grid;gap:10px;margin:10px 0 24px}
.dl-c{display:grid;gap:4px;border:1px solid rgba(55,53,47,.2);border-radius:8px;padding:12px 14px;text-decoration:none;color:#37352F;background:#fff}
.dl-c:hover{background:rgba(55,53,47,.05)}
.dl-c b{font-size:17px;font-weight:600}.dl-c span{font-size:14.5px;color:rgba(55,53,47,.75)}.dl-c em{font-style:normal;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}.dl-c em .tg{display:inline-block;margin:0;padding:1px 9px;border-radius:4px;background:rgba(55,53,47,.09);color:#37352F;font-size:12.5px;line-height:1.5}
.st-done .gt-nd{background:#0b0b0b;border-color:#0b0b0b;color:#fff}
.st-cur .gt-nd{background:#ffd84d;border:2.5px solid #0b0b0b;box-shadow:-3px 3px 0 #0b0b0b}
.st-todo .gt-nd{border-color:rgba(11,11,11,.35);color:rgba(11,11,11,.45)}
.st-todo .gt-d>summary .nt{color:rgba(11,11,11,.45);font-weight:600}
.dl-c{border:1.5px solid #0b0b0b;border-radius:10px}
.dl-c:hover{background:#fffbe6}
.dl-c b{font-family:Inter,system-ui,sans-serif;font-size:19px}
.ntn-h1{font-family:Inter,system-ui,sans-serif}
/* Hành trình dạng cây: thân cây là các trạm, tài liệu là nhánh chĩa ra */
.gt-note{font-size:14px;color:rgba(11,11,11,.65);margin:6px 0 4px}
.gt{position:relative;margin:10px 0 24px}
.gt-svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.gt-st{display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);position:relative;padding-bottom:18px}
.gt-m{position:relative}
.gt-m::before{content:"";position:absolute;left:23px;top:20px;bottom:-18px;border-left:2px dashed rgba(11,11,11,.3)}
.gt-st.st-done .gt-m::before{border-left:2px solid #0b0b0b}
.gt-last .gt-m::before{display:none}
.gt-nd{position:absolute;left:8px;top:3px;width:30px;height:30px;border-radius:50%;border:2px solid #0b0b0b;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#0b0b0b;box-sizing:border-box;z-index:1}
.st-done .gt-nd{background:#0b0b0b;color:#fff}
.st-cur .gt-nd{background:#ffd84d;box-shadow:0 0 0 4px #fff,0 0 0 6px #0b0b0b}
.st-todo .gt-nd{border-color:rgba(11,11,11,.35);color:rgba(11,11,11,.45)}
.gt-flag{font-size:15px}
.gt-l{padding-right:6px;min-width:0}
.gt-d>summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:36px;cursor:pointer;list-style:none;font-family:Inter,system-ui,sans-serif;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.gt-d>summary::-webkit-details-marker{display:none}.gt-d>summary::marker{content:""}
.gt-d>summary::after,.gt-d[open]>summary::after{content:none!important}
.st-todo .gt-d>summary{color:rgba(11,11,11,.45);font-weight:600}
.gt-d,.gt-more{border:0!important;background:none!important;margin:0!important;padding:0!important;box-shadow:none!important}
.gt-here{background:#ffd84d;color:#0b0b0b;border:1.5px solid #0b0b0b;border-radius:5px;font-family:Inter,system-ui,sans-serif;font-size:11.5px;font-weight:700;padding:0 7px}
.gt-dt{font-family:Inter,system-ui,sans-serif;font-size:12.5px;color:rgba(11,11,11,.5);font-weight:400}
.gt-bd{padding:6px 0 0}
.gt-r{position:relative;padding-top:2px;padding-left:10px;min-width:0}
.gt-rl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(11,11,11,.55);margin:0 0 6px 4px}
.gt-leaf{position:relative;display:block;margin:0 0 8px;padding:7px 11px;border:1.5px solid #0b0b0b;border-radius:9px;background:#ffd84d;color:#0b0b0b;text-decoration:none;font-size:14.5px;font-weight:600;line-height:1.3}
.gt-leaf::before{content:"";position:absolute;left:-34px;top:-14px;width:34px;height:calc(50% + 14px);border-left:1.5px solid #0b0b0b;border-bottom:1.5px solid #0b0b0b;border-bottom-left-radius:14px;box-sizing:border-box}
.gt-leaf:hover{background:#ffe68a}
.gt-leaf small{display:block;font-weight:400;font-size:12.5px;color:rgba(11,11,11,.7);margin-top:1px}
.st-done .gt-leaf,.st-todo .gt-leaf{background:#fff}
.st-todo .gt-leaf{border-color:rgba(11,11,11,.4);color:rgba(11,11,11,.55)}
.st-todo .gt-leaf::before{border-color:rgba(11,11,11,.3);border-left-style:dashed}
.gt-br{position:relative;margin:10px 0 0;border:1.5px solid #0b0b0b;border-radius:9px;padding:8px 12px 9px;background:#fff}
.gt-br.sub{border-style:dashed}
.gt-bt{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.gt-bt b{font-family:Inter,system-ui,sans-serif;font-size:16px}
.gt-bl{display:inline-block;font-size:12px;font-weight:600;color:rgba(11,11,11,.6);margin-bottom:2px}
.gt-ch{font-style:normal;font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;text-decoration-color:#e0a800}
.gt-ch.b{text-decoration-color:#2b78c9}.gt-ch.r{text-decoration-color:#d44c47}
.gt-br .nb{margin:6px 0 0}.gt-br .ntn-as{margin:0;padding:0;border:0}
.gt-st .nck li.y i{background:#0b0b0b;border-color:#0b0b0b}.gt-st .nck li i{border-color:#0b0b0b}
.gt-gt{margin:8px 0 12px;border:1.5px solid #0b0b0b;border-radius:9px;padding:8px 12px 6px;background:#fffbe6}
.gt-gh{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin-bottom:2px}.gt-gh b{font-family:Inter,system-ui,sans-serif;font-size:16px}.gt-gh span{font-weight:700}
.gt-chev{margin-left:auto;flex:none;width:10px;height:10px;border-right:2.5px solid #0b0b0b;border-bottom:2.5px solid #0b0b0b;transform:rotate(45deg);margin-top:-4px;margin-right:6px;transition:transform .15s}
.gt-d[open]>summary .gt-chev{transform:rotate(-135deg);margin-top:6px}
.st-todo .gt-chev{border-color:rgba(11,11,11,.4)}

.mtd{border-top:1px solid var(--line);padding:0}

.mtd .bd{padding:0 0 14px}.mtd .bd .ln{margin-top:8px}.mtd .none{color:var(--muted);margin:6px 0 0}

.wk2{margin:0 0 34px}

US:["Đăng ký đơn vị LLC","Giấy tờ chính chủ, khớp thông tin đăng ký","EIN","Tài khoản nhận tiền (Payoneer hoặc ngân hàng)","Đăng ký tài khoản bán hàng TikTok Shop, thông tin chính xác","Shop được xác minh và duyệt","Liên kết logistics và thông tin thuế trên store"]
};
function subs(n,mk){var x=(mk==="US"?SUBU:SUB)[n];return Array.isArray(x)?x:(x&&x[mk]?x[mk]:[])}
var FLAGS={ok:"Bình thường",ket:"Đang kẹt",cho:"Chờ bên thứ ba",cham:"Học viên chậm phản hồi"};
var MSTAT=["Sắp tới","Đã họp","Dời lịch","Hủy","Học viên vắng"];
var RL={0:"Hoàn tất",1:"Đúng tiến độ",2:"Theo dõi",3:"Cần can thiệp"};
var MK={US:"Thị trường US",VN:"Thị trường Việt Nam"};

/* ---------- helpers ---------- */
var pad=function(n){return String(n).padStart(2,"0")};
var iso=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var parse=function(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
var today=function(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
var diff=function(a,b){return Math.round((a-b)/864e5)};
var fmt=function(s){var d=parse(s);return d?pad(d.getDate())+"/"+pad(d.getMonth()+1):""};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var $=function(s,r){return (r||document).querySelector(s)};

/* ---------- state ---------- */
var db=null, students=[], meetings=[], assignments=[], reports=[], logs=[], sel=null, tab="theo-doi", pendingRender=false, confirmKey=null;
var colS=null, colM=null;

function analyze(s){
  var steps=s.steps||{}, mk=s.market==="US"?"US":"VN", t=today();
  var pbm=PBM[mk], ns=pbm.length, cur=ns+1, done=0, n;
  for(n=1;n<=ns;n++){ if(steps[n]) done++; }
  for(n=1;n<=ns;n++){ if(!steps[n]){cur=n;break;} }
  var since=null, days=0, std=null, ratio=0;
  if(cur<=ns){ since=parse(cur===1?s.start:steps[cur-1])||parse(s.start); days=since?Math.max(0,diff(t,since)):0; std=pbm[cur-1].std[mk]; ratio=days/std; }
  var ms=meetings.filter(function(m){return m.studentId===s.id});
  var held=ms.filter(function(m){return m.status==="Đã họp"&&parse(m.date)}).sort(function(a,b){return a.date<b.date?1:-1});
  var lastHeld=held.length?held[0]:null;
  var startD=parse(s.start);
  var gap=lastHeld?diff(t,parse(lastHeld.date)):(startD?Math.max(0,diff(t,startD)):0);
  var risk=1, why=[];
  if(cur===11){risk=0}
  else{
    if(s.flag==="ket"){risk=3; why.push("Đang kẹt"+(s.blocker?": "+s.blocker:""))}
    if(ratio>1.5){risk=3; why.push("Đã "+days+" ngày ở bước này, chuẩn "+std+" ngày")}
    else if(ratio>1){risk=Math.max(risk,2); why.push("Hơi chậm: "+days+" ngày, chuẩn "+std+" ngày")}
    if(s.flag==="cho"||s.flag==="cham"){risk=Math.max(risk,2); why.push(FLAGS[s.flag]+(s.blocker?": "+s.blocker:""))}
    if(gap>10){risk=Math.min(3,risk+1); why.push(gap+" ngày chưa họp")}
  }
  // meeting status
  var ws=new Date(t); ws.setDate(ws.getDate()-((t.getDay()+6)%7)); var we=new Date(ws); we.setDate(we.getDate()+7);
  var inWeek=ms.filter(function(m){var d=parse(m.date);return d&&d>=ws&&d<we&&m.status!=="Hủy"});
  var heldWeek=inWeek.filter(function(m){return m.status==="Đã họp"});
  var upcoming=ms.filter(function(m){var d=parse(m.date);return d&&d>=t&&(m.status==="Sắp tới")}).sort(function(a,b){return a.date<b.date?-1:1});
  var meet, meetNone=false;
  if(heldWeek.length) meet="Đã họp tuần này ("+fmt(heldWeek[0].date)+")";
  else if(upcoming.length&&diff(parse(upcoming[0].date),t)<7) meet="Họp "+fmt(upcoming[0].date)+(upcoming[0].time?" lúc "+upcoming[0].time:"");
  else if(upcoming.length){meetNone=true; meet="Chưa có lịch họp trong 7 ngày tới (kế tiếp "+fmt(upcoming[0].date)+")"}
  else {meet="Chưa có lịch họp trong 7 ngày tới"; meetNone=true}

  var active=(s.status||"Đang mentor")==="Đang mentor";
  var nextM=upcoming.length?upcoming[0]:null, nextIn=nextM?diff(parse(nextM.date),t):null;
  var missing=[];
  if(!s.phone&&!s.email) missing.push("liên hệ");
  if(!s.pkg) missing.push("gói");
  if(!s.platform) missing.push("sàn");
  if(!s.niche) missing.push("ngách");
  if(!s.goal) missing.push("mục tiêu");
  var attn=[];
  if(active&&cur<=ns){
    if(s.flag==="ket") attn.push({sev:3,t:"Đang kẹt"+(s.blocker?": "+s.blocker:"")});
    else if(s.flag==="cho"||s.flag==="cham") attn.push({sev:2,t:FLAGS[s.flag]+(s.blocker?": "+s.blocker:"")});
    if(ratio>1.5) attn.push({sev:3,t:"Đã "+days+" ngày ở bước "+cur+", chuẩn "+std+" ngày"});
    else if(ratio>1) attn.push({sev:2,t:"Hơi chậm ở bước "+cur+": "+days+" ngày, chuẩn "+std+" ngày"});
    if(!nextM||nextIn>=7) attn.push({sev:2,t:"Chưa có lịch họp trong 7 ngày tới"});
    if(!lastHeld&&startD&&diff(t,startD)>=3) attn.push({sev:2,t:"Chưa họp lần nào, đã "+diff(t,startD)+" ngày từ khi bắt đầu"});
    else if(gap>10) attn.push({sev:2,t:gap+" ngày chưa họp"});
    if(lastHeld&&!lastHeld.actions) attn.push({sev:1,t:"Buổi họp ngày "+fmt(lastHeld.date)+" chưa ghi action items"});
    var stale=ms.filter(function(m){var d=parse(m.date);return d&&d<t&&m.status==="Sắp tới"}).length;
    if(stale) attn.push({sev:2,t:stale+" buổi họp đã qua ngày nhưng vẫn ghi \"Sắp tới\", cần cập nhật trạng thái"});
  }
  if(active&&missing.length) attn.push({sev:1,t:"Hồ sơ còn thiếu: "+missing.join(", ")});
  var now=new Date();
  var openAss=assignments.filter(function(x){return x.studentId===s.id&&x.status!=="Đã nộp"&&x.status!=="Đạt"&&x.status!=="Hủy"}).map(function(x){
    var dd=parse(x.due), tm=/^(\d{1,2}):(\d{2})$/.exec(x.dueTime||"");
    var at=dd?new Date(dd.getFullYear(),dd.getMonth(),dd.getDate(),tm?+tm[1]:23,tm?+tm[2]:59):null;
    var o=Object.assign({},x); o.at=at; o.late=!!at&&at<now; o.soon=!!at&&!o.late&&(at-now)<=48*36e5; return o;
  }).sort(function(p,q){return (p.at||0)-(q.at||0)});
  if(active&&cur<=ns){
    openAss.forEach(function(x){
      if(x.late) attn.push({sev:3,t:"Bài trễ hạn: "+x.title+" (hạn "+fmt(x.due)+(x.dueTime?" "+x.dueTime:"")+")"});
      else if(x.soon) attn.push({sev:2,t:"Bài sắp đến hạn: "+x.title+" (hạn "+fmt(x.due)+(x.dueTime?" "+x.dueTime:"")+")"});
    });
    if(!openAss.length) attn.push({sev:2,t:"Chưa có bài nào đang giao"});
  }
  var attnSev=attn.reduce(function(m,x){return Math.max(m,x.sev)},0);
  return {s:s,mk:mk,pb:pbm,ns:ns,cur:cur,done:done,days:days,std:std,risk:risk,why:why,meet:meet,meetNone:meetNone,lastHeld:lastHeld,held:held,ms:ms,hasOrder:!!s.firstOrder||!!steps[ns],heldWeek:heldWeek.length>0,active:active,openAss:openAss,nextM:nextM,nextIn:nextIn,missing:missing,attn:attn,attnSev:attnSev,gap:gap,startD:startD};
}

/* ---------- render: Theo dõi ---------- */
function ruler(a){
  var s=a.s,h="",i;
  for(i=1;i<=a.ns;i++){
    var d=(s.steps||{})[i];
    h+='<i class="'+(d?"d":(i===a.cur?"c r"+a.risk:""))+'" title="'+i+'. '+esc(a.pb[i-1].name)+(d?" (xong "+fmt(d)+")":"")+'"></i>';
  }
  return '<div class="ruler" role="img" aria-label="Bước '+Math.min(a.cur,a.ns)+' trên '+a.ns+'">'+h+'</div>';
}
var DN=["T2","T3","T4","T5","T6","T7","CN"];
function mondayOf(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function secWeeks(){
  var t=today(), m0=mondayOf(t), names={}; students.forEach(function(s){names[s.id]=s.name});
  var out='';
  [0,1].forEach(function(w){
    var cells='';
    for(var i=0;i<7;i++){
      var d=addDays(m0,w*7+i), k=iso(d);
      var list=meetings.filter(function(m){return m.date===k&&m.status!=="Hủy"}).sort(function(a,b){return (a.time||"")<(b.time||"")?-1:1});
      cells+='<div class="day'+(k===iso(t)?" today":"")+(d<t?" past":"")+'"><div class="dn">'+DN[i]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'</div>'
        +list.map(function(m){
            var stale=d<t&&m.status==="Sắp tới";
            return '<div class="mt '+(m.status==="Đã họp"?"held":(stale||m.status!=="Sắp tới"?"oth":"up"))+'">'+esc(names[m.studentId]||"Không rõ")+'<small>'+(m.time?esc(m.time)+' · ':'')+esc(stale?"cần cập nhật":m.status)+'</small></div>';}).join("")
        +'</div>';
    }
    out+='<div class="wk"><div class="wkh">'+(w?"Tuần sau":"Tuần này")+' · từ '+pad(addDays(m0,w*7).getDate())+'/'+pad(addDays(m0,w*7).getMonth()+1)+'</div><div class="week">'+cells+'</div></div>';
  });
  return '<section class="sec"><h2>Lịch họp 2 tuần</h2><p class="hint">Buổi đã qua ngày mà vẫn ghi "Sắp tới" hiện màu đỏ để bạn cập nhật.</p><div class="scrollx">'+out+'</div></section>';
}
function secDist(all){
  var out='';
  [["VN","Việt Nam"],["US","US"]].forEach(function(m){
    var live=all.filter(function(a){return a.mk===m[0]}); if(!live.length) return;
    var pb=PBM[m[0]], N=live.length, h='';
    for(var k=1;k<=pb.length;k++){
      var done=live.filter(function(a){return (a.s.steps||{})[k]}).length;
      var cur=live.filter(function(a){return a.cur===k}).length;
      h+='<div class="fun"><div class="lb">'+k+'. '+esc(pb[k-1].name)+'</div><div class="tr" role="img" aria-label="'+done+' xong, '+cur+' đang làm trên '+N+'"><i class="d" style="width:'+(done/N*100)+'%"></i><i class="c" style="width:'+(cur/N*100)+'%"></i></div><div class="nu">xong '+done+' · đang '+cur+'</div></div>';
    }
    out+='<section class="sec"><h2>Phễu '+pb.length+' bước, '+m[1]+'</h2><p class="hint">Màu đậm là số học viên đã xong bước đó, màu nhạt là đang làm. Thấy ngay bước nào đang nghẽn.</p>'+h+'</section>';
  });
  return out;
}
function secBullet(live){
  var rows=live.filter(function(a){return a.cur<=a.ns}).sort(function(x,y){return y.days/y.std-x.days/x.std});
  if(!rows.length) return '';
  var h=rows.map(function(a){
    var r=a.days/a.std, rc=r>1.5?"r3":(r>1?"r2":"r1");
    return '<div class="bul '+rc+'"><div class="lb"><a href="#/'+esc(a.s.id)+'" style="color:inherit;text-decoration:none">'+esc(a.s.name)+'</a></div><div class="tr"><i style="width:'+(Math.min(r,1.5)/1.5*100)+'%"></i><b></b></div><div class="nu">'+a.days+'/'+a.std+' ngày</div></div>';
  }).join("");
  return '<section class="sec"><h2>Ngày ở bước so với chuẩn</h2><p class="hint">Vạch đen là mốc chuẩn của bước đang làm. Thanh vượt vạch nghĩa là đã chậm hơn chuẩn. Sắp xếp người chậm nhất lên đầu.</p>'+h+'</section>';
}
function fig(v,l,c){return '<div class="fig '+(c||"")+'"><b>'+v+'</b><span>'+l+'</span></div>'}
var MAIN=[["tong-quan","Tổng quan"],["bieu-do","Biểu đồ"],["lich","Lịch họp"],["hoc-vien","Học viên"]];
function mainNav(cur){
  return MAIN.map(function(t){return '<a href="#/'+t[0]+'"'+(t[0]===cur?' aria-current="page"':'')+'>'+t[1]+'</a>'}).join("");
}
var DOW=["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];
function who(a){return '<a href="#/'+esc(a.s.id)+'">'+esc(a.s.name)+'</a>'}
function whoList(list){return list.map(who).join(", ")}
function secToday(live){
  var t=today(), now=new Date(), urgent=[], t3=addDays(t,3);
  live.forEach(function(a){
    a.openAss.forEach(function(x){ if(x.late){var n=Math.max(1,Math.ceil((now-x.at)/864e5)); urgent.push(who(a)+': bài "'+esc(x.title)+'" quá hạn '+n+' ngày');} });
    if(a.s.focus) urgent.unshift(who(a)+': '+esc(a.s.focus));
    if(a.s.flag==="ket") urgent.push(who(a)+': đang kẹt'+(a.s.blocker?', '+esc(a.s.blocker):''));
    assignments.filter(function(x){return x.studentId===a.s.id&&x.status==="Đã nộp"&&!(x.reviews&&x.reviews.length)}).forEach(function(x){
      urgent.push(who(a)+': đã nộp "'+esc(x.title)+'", chờ nhận xét');});
  });
  var coming=meetings.filter(function(m){var d=parse(m.date);return d&&d>=t&&d<=t3&&m.status==="Sắp tới"}).sort(function(p,q){return (p.date+(p.time||""))<(q.date+(q.time||""))?-1:1});
  var nm={}; students.forEach(function(x){nm[x.id]=x});
  var noMeet=live.filter(function(a){return a.cur<=a.ns&&a.meetNone});
  var noAss=live.filter(function(a){return a.cur<=a.ns&&!a.openAss.length});
  var stale=live.filter(function(a){return a.ms.some(function(m){var d=parse(m.date);return d&&d<t&&m.status==="Sắp tới"})});
  var noAcct=students.filter(function(x){return (x.status||"Đang mentor")==="Đang mentor"&&!(x.account&&x.account.password)});
  var cnt={US:0,VN:0}; live.forEach(function(a){cnt[a.mk]++});
  var out='<section class="sec"><h2>Hôm nay, '+DOW[t.getDay()]+' '+pad(t.getDate())+'/'+pad(t.getMonth()+1)+'</h2>';
  out+='<h3 class="gr'+(urgent.length?' red':'')+'">Cần xử lý</h3>'+(urgent.length?'<ul class="tl2 red">'+urgent.map(function(h){return '<li>'+h+'</li>'}).join("")+'</ul>':'<p class="hint">Không có việc gấp.</p>');
  out+='<h3 class="gr">Họp trong 3 ngày tới</h3>'+(coming.length?'<ul class="tl2 mtl">'+coming.map(function(m){var d=parse(m.date),a=nm[m.studentId];
    return '<li><span class="tm">'+DOW[d.getDay()]+' '+pad(d.getDate())+'/'+pad(d.getMonth()+1)+(m.time?', '+esc(m.time):'')+'</span><b>'+(a?'<a href="#/'+esc(a.id)+'">'+esc(a.name)+'</a>':'Không rõ')+'</b></li>'}).join("")+'</ul>':'<p class="hint">Chưa có buổi họp nào trong 3 ngày tới.</p>');
  var plan=[];
  if(noMeet.length) plan.push(['Chưa có lịch họp trong 7 ngày tới',whoList(noMeet)]);
  if(stale.length) plan.push(['Buổi họp đã qua, chưa cập nhật trạng thái',whoList(stale)]);
  if(noAss.length) plan.push(['Chưa có bài đang giao',whoList(noAss)]);
  if(noAcct.length) plan.push(['Chưa có tài khoản đăng nhập',noAcct.map(function(x){return '<a href="#/'+esc(x.id)+'">'+esc(x.name)+'</a>'+(x.email?'':' (thiếu email)')}).join(", ")]);
  if(plan.length) out+='<h3 class="gr">Cần sắp xếp</h3><ul class="tl2 plan">'+plan.map(function(r){return '<li><b>'+r[0]+'</b><span>'+r[1]+'</span></li>'}).join("")+'</ul>';
  return out+'</section>';
}
function todoOf(a){
  if(a.s.focus) return {t:a.s.focus.charAt(0).toUpperCase()+a.s.focus.slice(1),red:true};
  var it=a.attn.filter(function(x){return x.sev>=2&&x.t.indexOf("Chưa có lịch họp")!==0&&x.t.indexOf("Chưa có bài nào")!==0&&x.t.indexOf("Chưa họp lần nào")!==0}).sort(function(p,q){return q.sev-p.sev});
  if(it.length) return {t:it[0].t,red:it[0].sev>=3};
  if(a.openAss.length) return {t:'Bài: '+a.openAss[0].title+(a.openAss[0].due?', hạn '+fmt(a.openAss[0].due):''),red:false};
  return {t:'',red:false};
}
function rowT(a){
  var s=a.s, pb=a.cur<=a.ns?a.pb[a.cur-1]:null, td=todoOf(a);
  return '<div class="rost"><div class="n"><a href="#/'+esc(s.id)+'">'+esc(s.name)+'</a><small>'+esc([s.pkg,s.platform].filter(Boolean).join(" · "))+'</small></div>'
   +'<div class="p">'+ruler(a)+'<span>'+(pb?'Bước '+a.cur+'/'+a.ns+': '+esc(pb.name):'Đã xong '+a.ns+' bước')+'</span></div>'
   +'<div class="m'+(a.meetNone?' none':'')+'">'+esc(a.meet)+'</div>'
   +'<div class="x'+(td.red?' red':'')+'">'+esc(td.t)+'</div></div>';
}
function viewTrack(tab){
  tab=tab||"tong-quan";
  var as=students.map(analyze);
  var active=as.filter(function(a){return a.s.status!=="Dừng"});
  var live=as.filter(function(a){return a.active});
  if(!students.length) return '<div class="empty">Chưa có học viên. Nhắn trong cuộc trò chuyện để thêm học viên.</div>';
  if(tab==="bieu-do") return secBullet(live)+secDist(live);
  if(tab==="lich") return secWeeks();
  if(tab==="hoc-vien"){
    var out='<section class="sec"><h2>Học viên</h2><p class="lead">Người cần xử lý nằm trên cùng. Bấm tên để mở trang riêng.</p>';
    ["VN","US"].forEach(function(mk){
      var list=active.filter(function(a){return a.mk===mk}).sort(function(x,y){
        var rx=x.cur>x.ns?-1:x.risk, ry=y.cur>y.ns?-1:y.risk; return ry-rx||y.days-x.days;});
      out+='<div class="mk-h">'+(mk==="VN"?"Việt Nam":"US")+'<small>'+list.length+' học viên</small></div>'
        +(list.length?'<div class="rost h"><div>Học viên</div><div>Tiến độ</div><div>Buổi họp</div><div>Việc cần làm</div></div>'+list.map(rowT).join(""):'<p class="hint">Chưa có học viên.</p>');
    });
    return out+'</section>';
  }
  var t0=today(), t3=addDays(t0,3);
  var cnt={VN:0,US:0}; live.forEach(function(a){cnt[a.mk]++});
  var late=live.reduce(function(n,a){return n+a.openAss.filter(function(x){return x.late}).length},0);
  var openN=live.reduce(function(n,a){return n+a.openAss.length},0);
  var noMeetN=live.filter(function(a){return a.cur<=a.ns&&a.meetNone}).length;
  var comingN=meetings.filter(function(m){var d=parse(m.date);return d&&d>=t0&&d<=t3&&m.status==="Sắp tới"}).length;
  var slowN=live.filter(function(a){return a.cur<=a.ns&&(a.risk>=3||a.s.focus)}).length;
  var orders=active.filter(function(a){return a.hasOrder}).length;
  var strip='<div class="brief">'
    +fig(live.length,"học viên đang mentor ("+cnt.VN+" Việt Nam, "+cnt.US+" US)")

function mdLite(src){
  var L=String(src||"").split("\n"),o="",i=0;
  while(i<L.length){
    var l=L[i];
    if(/^\s*$/.test(l)){i++;continue}
    if(/^#{2,3}\s/.test(l)){o+='<h4>'+inl(l.replace(/^#{2,3}\s+/,""))+'</h4>';i++;continue}
    if(/^-\s/.test(l)){var li="";while(i<L.length&&/^-\s/.test(L[i])){li+='<li>'+inl(L[i].replace(/^-\s+/,""))+'</li>';i++}o+='<ul>'+li+'</ul>';continue}
    if(/^\|/.test(l)){
      var rows=[];
      while(i<L.length&&/^\|/.test(L[i])){
        if(!/^\|[\s:|-]+\|?\s*$/.test(L[i])) rows.push(L[i].replace(/^\||\|\s*$/g,"").split("|").map(function(c){return c.trim()}));
        i++;
      }
      o+='<div class="scrollx"><table class="rt">'+rows.map(function(r,k){return '<tr>'+r.map(function(c){return k?'<td>'+inl(c)+'</td>':'<th>'+inl(c)+'</th>'}).join("")+'</tr>'}).join("")+'</table></div>';
      continue;
    }
    var p=[];
    while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#{2,3}\s|-\s|\|)/.test(L[i])){p.push(L[i]);i++}
    o+='<p>'+inl(p.join(" "))+'</p>';
  }
  return o;
}

function stepModel(a){
  var s=a.s, steps=s.steps||{}, mk=a.mk, prev=parse(s.start), out=[];
  for(var n=1;n<=a.ns;n++){
    var d=parse(steps[n]), pb=a.pb[n-1], std=pb.std[mk], sub=subs(n,mk), ck=((s.checks||{})[n])||[];
    var st=d?"done":(n===a.cur?"cur":"todo"), days=null;
    if(d&&prev) days=Math.max(0,diff(d,prev)); else if(st==="cur") days=a.days;
    var nd=st==="done"?sub.length:ck.filter(function(i){return i>=0&&i<sub.length}).length;
    out.push({n:n,pb:pb,st:st,raw:steps[n],days:days,std:std,sub:sub,ck:ck,nd:nd});
    if(d) prev=d;
  }
  return out;
}

function secActivity(a){

  a.ms.forEach(function(m){
    if(m.status==="Hủy") return;
    ev.push({d:m.date,k:m.status==="Đã họp"?"held":(m.status==="Sắp tới"?"meet":"oth"),g:"meet",t:"Họp 1:1"+(m.time?" lúc "+m.time:"")+" ("+m.status+")",x:m.actions?"Action items: "+m.actions:""});
  });
  assignments.filter(function(x){return x.studentId===s.id}).forEach(function(x){
    if(x.assignedOn) ev.push({d:x.assignedOn,k:"ass",g:"ass",t:"Giao bài: "+x.title});
    if(x.due){
      if(x.status==="Đã nộp"||x.status==="Đạt") ev.push({d:x.due,k:"sub",g:"ass",t:"Đã nộp: "+x.title});
      else if(x.status!=="Hủy"){var late=x.due<tk; ev.push({d:x.due,k:late?"late":"due",g:"ass",t:(late?"Quá hạn: ":"Hạn nộp: ")+x.title+(x.dueTime?" "+x.dueTime:"")});}
    }
  });
  logs.filter(function(l){return l.studentId===s.id&&l.date}).forEach(function(l){ev.push({d:l.date,k:"note",g:"note",t:l.text,x:l.step?"Bước "+l.step:""})});
  // biểu đồ 8 tuần
  var m0=mondayOf(t), wk=[];
  for(var i=7;i>=0;i--){var w=addDays(m0,-7*i); wk.push({a:iso(w),b:iso(addDays(w,7)),c:{step:0,meet:0,ass:0,note:0}})}
  ev.forEach(function(e){wk.forEach(function(w){if(e.d>=w.a&&e.d<w.b&&e.d<=tk) w.c[e.g]++})});
  var mx=Math.max.apply(null,wk.map(function(w){return w.c.step+w.c.meet+w.c.ass+w.c.note}).concat([1]));
  var chart='<div class="wa">'+wk.map(function(w){
    var tot=w.c.step+w.c.meet+w.c.ass+w.c.note;
    return '<div class="c" title="'+fmt(w.a)+': '+tot+' hoạt động" style="height:'+(tot?Math.max(10,tot/mx*100):0)+'%">'+["note","ass","meet","step"].map(function(g){return w.c[g]?'<i class="st-'+g+'" style="flex:'+w.c[g]+'"></i>':''}).join("")+'</div>';
  }).join("")+'</div><div class="wax">'+wk.map(function(w){return '<span>'+fmt(w.a)+'</span>'}).join("")+'</div>'
  +'<div class="legend"><span><i class="sw-done"></i>Bước hoàn thành</span><span><i style="background:var(--ink)"></i>Buổi họp</span><span><i style="background:var(--f-warn)"></i>Bài tập</span><span><i style="background:#a9c4f7"></i>Ghi chú</span></div>';
  var up=ev.filter(function(e){return e.d>tk}).sort(function(p,q){return p.d<q.d?-1:1});
  var past=ev.filter(function(e){return e.d<=tk}).sort(function(p,q){return p.d<q.d?1:-1});
  function dl(d){var x=parse(d);return DN[(x.getDay()+6)%7]+" "+fmt(d)}
  function group(list){var o="",cur=null;list.forEach(function(e){if(e.d!==cur){cur=e.d;o+='<li class="dh'+(e.d>tk?" up":"")+'">'+dl(e.d)+(e.d===tk?" · hôm nay":"")+'</li>'}
    o+='<li class="e '+e.k+'"><div>'+esc(e.t)+(e.x?'<small>'+esc(e.x)+'</small>':'')+'</div></li>'});return o}
  return '<section class="sec"><h2>Hoạt động và nhật ký hằng ngày</h2><p class="hint">Mọi việc đã diễn ra với học viên này theo từng ngày: bước hoàn thành, buổi họp, bài tập và ghi chú. Biểu đồ đếm số hoạt động 8 tuần gần nhất.</p>'+chart

}

function ntnLines(t){

  String(t||"").split("\n").forEach(function(l){
    l=l.trim(); if(!l) return;
    if(/^-\s/.test(l)){buf.push(l.replace(/^-\s+/,""));return}
    flush(); o+=/:$/.test(l)?'<p class="nh">'+inl(l)+'</p>':'<p>'+inl(l)+'</p>';
  });
  flush(); return o;
}
function ntnStepOf(date,steps,ns,cur){

  for(var n=1;n<=ns;n++){var e=parse(steps[n]); if(e&&d<=e) return n; if(!e) return n}
  return ns;
}

    var pa=document.createElementNS("http://www.w3.org/2000/svg","path");pa.setAttribute("d",d);pa.setAttribute("fill","none");pa.setAttribute("stroke","#0b0b0b");pa.setAttribute("stroke-width","1.5");pa.setAttribute("stroke-dasharray","2 5");pa.setAttribute("stroke-linecap","round");sv.appendChild(pa);
